<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - INTEGRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    
    <div class="bg-white p-8 rounded shadow-lg w-full max-w-sm border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Acceso al Editor</h2>
        
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-3 mb-4 text-sm rounded border border-red-200">
            Usuario o contraseña incorrectos.
        </div>

        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Usuario</label>
                <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500" required>
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition-colors">
                Ingresar al sistema
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, password })
                });

                if (response.ok) {
                    btn.textContent = 'Acceso correcto. Ingresando...';
                    btn.className = 'w-full bg-green-600 text-white font-bold py-2 px-4 rounded text-white';
                    setTimeout(() => {
                        window.location.href = '/editor.html';
                    }, 400);
                } else {
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Ingresar al sistema';
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión con el servidor.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Ingresar al sistema';
            }
        });
    </script>
</body>
</html>
