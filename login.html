<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - INTEGRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    
    <div class="bg-white p-8 rounded shadow-lg w-full max-w-sm border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Acceso al Editor</h2>
        
        <!-- Mensaje de error oculto por defecto -->
        <div id="error-msg" class="hidden bg-red-100 text-red-700 p-3 mb-4 text-sm rounded border border-red-200">
            Usuario o contraseña incorrectos.
        </div>

        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Usuario</label>
                <input type="text" id="username" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition-colors">
                Ingresar al sistema
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Validación de credenciales
            if (user === 'admin' && pass === 'secreto123') {
                // Creamos la cookie válida para todo el sitio, expira en 1 día (86400 segundos)
                document.cookie = "admin_session=autorizado; path=/; max-age=86400";
                
                // Redirigimos al editor. El middleware ahora verá la cookie y nos dejará pasar.
                window.location.href = "/editor.html";
            } else {
                // Mostramos el mensaje de error
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
