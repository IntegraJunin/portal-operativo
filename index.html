<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Datos - Index, Buscador y Editor</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            width: 100%;
        }

        /* Buscador */
        .search-box {
            flex-grow: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        /* Botones */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #10b981;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #059669;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-action {
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            margin-right: 0.25rem;
        }

        /* Tabla Index */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        /* Editor (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Gestión de Registros</h1>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por nombre, categoría o estado...">
            </div>
            <button class="btn btn-primary" onclick="openEditor()">+ Nuevo</button>
            <button class="btn btn-secondary" onclick="exportToCSV()">Exportar CSV</button>
        </div>
    </header>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Los registros se cargan dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Editor -->
<div class="modal-overlay" id="editorModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Editor de Registro</h3>
        </div>
        <form id="editorForm" onsubmit="saveRecord(event)">
            <input type="hidden" id="recordId">
            <div class="form-group">
                <label for="inputNombre">Nombre / Título</label>
                <input type="text" id="inputNombre" required>
            </div>
            <div class="form-group">
                <label for="inputCategoria">Categoría</label>
                <input type="text" id="inputCategoria" required>
            </div>
            <div class="form-group">
                <label for="inputEstado">Estado</label>
                <select id="inputEstado">
                    <option value="Activo">Activo</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" style="background:#e5e7eb; color:#374151;" onclick="closeEditor()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Datos iniciales (Simulación de la estructura del Excel)
    let dataset = [
        { id: 1, nombre: "Juan Pérez", categoria: "Soporte", estado: "Activo" },
        { id: 2, nombre: "María Gómez", categoria: "Ventas", estado: "Pendiente" },
        { id: 3, nombre: "Carlos López", categoria: "Desarrollo", estado: "Activo" },
        { id: 4, nombre: "Ana Martínez", categoria: "Diseño", estado: "Inactivo" }
    ];

    let currentEditId = null;

    // Renderizar la tabla (Index)
    function renderTable(data = dataset) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No se encontraron registros.</td></tr>`;
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.id}</td>
                <td><strong>${escapeHtml(item.nombre)}</strong></td>
                <td>${escapeHtml(item.categoria)}</td>
                <td>${escapeHtml(item.estado)}</td>
                <td>
                    <button class="btn btn-primary btn-action" onclick="openEditor(${item.id})">Editar</button>
                    <button class="btn btn-danger btn-action" onclick="deleteRecord(${item.id})">Eliminar</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // Buscador en tiempo real
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        const filtered = dataset.filter(item => 
            item.nombre.toLowerCase().includes(query) ||
            item.categoria.toLowerCase().includes(query) ||
            item.estado.toLowerCase().includes(query) ||
            item.id.toString().includes(query)
        );
        renderTable(filtered);
    });

    // Abrir Editor (Modal) para crear o modificar
    function openEditor(id = null) {
        currentEditId = id;
        const modal = document.getElementById('editorModal');
        const title = document.getElementById('modalTitle');

        if (id) {
            const record = dataset.find(item => item.id === id);
            if (!record) return;
            title.textContent = "Editar Registro #" + id;
            document.getElementById('recordId').value = record.id;
            document.getElementById('inputNombre').value = record.nombre;
            document.getElementById('inputCategoria').value = record.categoria;
            document.getElementById('inputEstado').value = record.estado;
        } else {
            title.textContent = "Nuevo Registro";
            document.getElementById('editorForm').reset();
            document.getElementById('recordId').value = '';
        }

        modal.classList.add('active');
    }

    function closeEditor() {
        document.getElementById('editorModal').classList.remove('active');
    }

    // Guardar (Agregar / Actualizar)
    function saveRecord(e) {
        e.preventDefault();
        const idVal = document.getElementById('recordId').value;
        const nombre = document.getElementById('inputNombre').value.trim();
        const categoria = document.getElementById('inputCategoria').value.trim();
        const estado = document.getElementById('inputEstado').value;

        if (idVal) {
            // Actualizar existente
            const index = dataset.findIndex(item => item.id === parseInt(idVal));
            if (index !== -1) {
                dataset[index] = { id: parseInt(idVal), nombre, categoria, estado };
            }
        } else {
            // Crear nuevo registro con ID autoincrementable
            const newId = dataset.length > 0 ? Math.max(...dataset.map(i => i.id)) + 1 : 1;
            dataset.push({ id: newId, nombre, categoria, estado });
        }

        closeEditor();
        renderTable();
        document.getElementById('searchInput').value = ''; // Limpiar búsqueda
    }

    // Eliminar registro
    function deleteRecord(id) {
        if (confirm(`¿Estás seguro de que deseas eliminar el registro #${id}?`)) {
            dataset = dataset.filter(item => item.id !== id);
            renderTable();
        }
    }

    // Exportar datos actualizados a archivo compatible con Excel (.csv)
    function exportToCSV() {
        if (dataset.length === 0) {
            alert("No hay datos para exportar.");
            return;
        }

        const headers = ["ID", "Nombre", "Categoria", "Estado"];
        const rows = dataset.map(item => [
            item.id,
            `"${item.nombre.replace(/"/g, '""')}"`,
            `"${item.categoria.replace(/"/g, '""')}"`,
            `"${item.estado}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "registros_actualizados.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Sanitización simple contra XSS
    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', () => renderTable());
</script>

</body>
</html>
