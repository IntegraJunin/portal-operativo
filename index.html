<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .iframe-container { width: 100%; height: calc(100vh - 80px); border: none; }
    </style>
</head>
<body>

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="#">Portal Operativo INTEGRA</a>
        <div class="ms-auto d-flex gap-2">
            <button class="btn btn-primary" onclick="mostrarSeccion('manuales')">📄 Manuales de Procedimiento</button>
            <button class="btn btn-outline-light" onclick="mostrarSeccion('precios')">🔍 Buscador de Precios</button>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container-fluid p-0">
        
        <!-- SECCIÓN 1: MANUALES -->
        <div id="sec-manuales" class="row g-0">
            <div class="col-md-3 bg-white border-end p-3" style="height: calc(100vh - 56px); overflow-y: auto;">
                <h6 class="fw-bold text-secondary mb-3">SELECCIONE UN MANUAL</h6>
                <div class="list-group list-group-flush">
                    
                    <span class="text-uppercase small fw-bold text-muted mt-2">Diagnóstico por Imágenes</span>
                    <button class="list-group-item list-group-item-action border-0 ps-0" onclick="cargarPdf('manuales/CONVENIOS IMAGENES.pdf')">• Convenios Imágenes (COMED / Capponi)</button>
                    
                    <span class="text-uppercase small fw-bold text-muted mt-3">Laboratorio</span>
                    <button class="list-group-item list-group-item-action border-0 ps-0" onclick="cargarPdf('manuales/ORDENES LABORATORIO.pdf')">• Emisión Órdenes Laboratorio</button>
                    
                    <span class="text-uppercase small fw-bold text-muted mt-3">Altas y Afiliaciones</span>
                    <button class="list-group-item list-group-item-action border-0 ps-0" onclick="cargarPdf('manuales/PROCESO ALTAS Y ASOCIACIONES.pdf')">• Proceso Altas y Asociaciones</button>
                    
                    <span class="text-uppercase small fw-bold text-muted mt-3">Oftalmología</span>
                    <button class="list-group-item list-group-item-action border-0 ps-0" onclick="cargarPdf('manuales/TOMOGRAFÍAS OPTICAS.pdf')">• Tomografías Ópticas (OCT / HRT)</button>
                    
                    <span class="text-uppercase small fw-bold text-muted mt-3">Consultas Médicas</span>
                    <button class="list-group-item list-group-item-action border-0 ps-0" onclick="cargarPdf('manuales/Consultas_Medicas_Integra_360.pdf')">• Procedimiento Consultas Médicas</button>
                
                </div>
            </div>
            <div class="col-md-9">
                <iframe id="viewer-pdf" class="iframe-container bg-white" src="about:blank"></iframe>
            </div>
        </div>

        <!-- SECCIÓN 2: BUSCADOR DE PRECIOS -->
        <div id="sec-precios" class="d-none">
            <iframe src="buscador.html" class="iframe-container bg-white"></iframe>
        </div>

    </div>

    <!-- JavaScript de Control -->
    <script>
        function cargarPdf(ruta) {
            document.getElementById('viewer-pdf').src = ruta;
        }

        function mostrarSeccion(seccion) {
            const secManuales = document.getElementById('sec-manuales');
            const secPrecios = document.getElementById('sec-precios');

            if (seccion === 'manuales') {
                secManuales.classList.remove('d-none');
                secPrecios.classList.add('d-none');
            } else if (seccion === 'precios') {
                secManuales.classList.add('d-none');
                secPrecios.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
