<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .iframe-container { width: 100%; height: calc(100vh - 120px); border: none; }
    </style>
</head>
<body>

    <!-- Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="#">Portal Operativo INTEGRA</a>
        <div class="ms-auto d-flex gap-2">
            <button class="btn btn-primary" onclick="mostrarSeccion('manuales')">📄 Manuales de Procedimiento</button>
            <button class="btn btn-outline-light" onclick="mostrarSeccion('precios')">🔍 Buscador de Precios</button>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container-fluid my-3">
        
        <!-- SECCIÓN 1: MANUALES -->
        <div id="sec-manuales" class="row">
            <div class="col-md-4">
                <div class="list-group">
                    <span class="list-group-item bg-light fw-bold text-muted">DIAGNÓSTICO POR IMÁGENES</span>
                    <button class="list-group-item list-group-item-action" onclick="cargarPdf('manuales/CONVENIOS_IMAGENES.pdf')">Convenios Imágenes (COMED / Capponi)</button>
                    
                    <span class="list-group-item bg-light fw-bold text-muted mt-2">LABORATORIO</span>
                    <button class="list-group-item list-group-item-action" onclick="cargarPdf('manuales/ORDENES_LABORATORIO.pdf')">Emisión Órdenes Laboratorio</button>
                    
                    <span class="list-group-item bg-light fw-bold text-muted mt-2">ALTAS Y AFILIACIONES</span>
                    <button class="list-group-item list-group-item-action" onclick="cargarPdf('manuales/ALTAS_Y_AFILIACIONES.pdf')">Proceso Altas y Asociaciones</button>
                    
                    <span class="list-group-item bg-light fw-bold text-muted mt-2">OFTALMOLOGÍA</span>
                    <button class="list-group-item list-group-item-action" onclick="cargarPdf('manuales/OFTALMOLOGIA_OCT.pdf')">Tomografías Ópticas (OCT / HRT)</button>
                    
                    <span class="list-group-item bg-light fw-bold text-muted mt-2">CONSULTAS MÉDICAS</span>
                    <button class="list-group-item list-group-item-action" onclick="cargarPdf('manuales/CONSULTAS_MEDICAS.pdf')">Procedimiento Consultas Médicas</button>
                </div>
            </div>
            <div class="col-md-8">
                <iframe id="viewer-pdf" class="iframe-container border rounded bg-white" src="about:blank"></iframe>
            </div>
        </div>

        <!-- SECCIÓN 2: BUSCADOR DE PRECIOS (IFRAME) -->
        <div id="sec-precios" class="d-none">
            <iframe src="buscador.html" class="iframe-container border rounded bg-white"></iframe>
        </div>

    </div>

    <!-- JavaScript de Control -->
    <script>
        function cargarPdf(ruta) {
            document.getElementById('viewer-pdf').src = ruta;
        }

        function mostrarSeccion(seccion) {
            const secManuales = document.getElementById('sec-manuales');
            const secPrecios = document.getElementById('sec-precios');

            if (seccion === 'manuales') {
                secManuales.classList.remove('d-none');
                secPrecios.classList.add('d-none');
            } else if (seccion === 'precios') {
                secManuales.classList.add('d-none');
                secPrecios.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
