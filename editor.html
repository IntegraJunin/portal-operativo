<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA - Acceso Seguro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f4e7dc;
            --bg-card: #ffffff;
            --bg-box: #fbf5ef;
            --border-box: #e5d3c5;
            --text-brand: #4a3525;
            --chip-bg: #e8dad0;
            --chip-text: #4a3525;
            --chip-active-bg: #4a382a;
            --chip-active-text: #ffffff;
            --accent-orange: #b85a3c;
        }

        html, body {
            height: 100vh !important;
            max-height: 100vh !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background-color: var(--bg-main);
            font-family: 'Comfortaa', cursive;
            color: var(--text-brand);
        }

        h1, h2, h3, button, input, select, table, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0beb0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a698; }

        .filtro-card {
            background-color: var(--bg-box);
            border: 1.5px solid var(--border-box);
            border-radius: 14px;
            padding: 12px;
        }

        .filtro-titulo {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-brand);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #tabla-wrap table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 550px;
        }

        #tabla-wrap th, #tabla-wrap td {
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
        }

        #tabla-wrap thead th {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #7a6657;
            background: #faf6f0;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #ede3da;
            z-index: 10;
        }

        #tabla-wrap tbody td:first-child, #tabla-wrap thead th:first-child {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 1;
            white-space: normal;
            min-width: 220px;
        }

        #tabla-wrap thead th:first-child { background: #faf6f0; z-index: 20; }
        #tabla-wrap tbody tr:nth-child(even) td { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:nth-child(even) td:first-child { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:hover td { background-color: #f3e9e0; }

        #tabla-wrap tbody td {
            border-bottom: 1px solid #f2e9e1;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #3d2e24;
            font-size: 13px;
        }

        #tabla-wrap .celda-item { font-weight: 700; color: #3b291a; }
        #tabla-wrap .celda-categoria {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: var(--accent-orange);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
        }

        #tabla-wrap .celda-vacia { color: #c0b2a6; font-weight: 600; }
        
        .input-precio-edit {
            width: 100%;
            max-width: 110px;
            padding: 3px 6px;
            border: 1px solid #b85a3c;
            border-radius: 6px;
            font-weight: 700;
            color: #3b291a;
            background-color: #fffbeb;
            outline: none;
        }
    </style>
</head>
<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden">

    <!-- PANTALLA DE LOGIN (MODAL / OVERLAY) -->
    <div id="pantalla-login" class="fixed inset-0 z-50 bg-[#f4e7dc] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border border-[#e5d3c5] shadow-xl p-8 w-full max-w-md flex flex-col items-center">
            <div class="w-16 h-16 bg-[#fbf5ef] border border-[#e5d3c5] rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-sm">
                🔐
            </div>
            <h1 class="text-xl font-extrabold text-[#3b291a] text-center mb-1">Portal Operativo INTEGRA</h1>
            <p class="text-xs font-semibold text-gray-500 text-center mb-6">Ingrese sus credenciales de administrador para continuar</p>

            <form id="form-login" class="w-full space-y-4" onsubmit="intentarLogin(event)">
                <div>
                    <label class="block text-xs font-extrabold text-[#4a3525] uppercase tracking-wider mb-1.5">Usuario</label>
                    <input type="text" id="usuario-input" required placeholder="Ej. admin" class="w-full px-4 py-2.5 rounded-xl border border-[#e5d3c5] bg-[#faf6f0] text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c]">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-[#4a3525] uppercase tracking-wider mb-1.5">Contraseña</label>
                    <input type="password" id="password-input" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-[#e5d3c5] bg-[#faf6f0] text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c]">
                </div>

                <div id="mensaje-error" class="text-xs font-bold text-red-600 text-center hidden">
                    Usuario o contraseña incorrectos.
                </div>

                <button type="submit" class="w-full bg-[#b85a3c] hover:bg-[#964229] text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition transform active:scale-95">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (OCULTO HASTA AUTENTICARSE) -->
    <div id="contenido-principal" class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-0 overflow-hidden hidden">
        
        <!-- COLUMNA IZQUIERDA: FILTRO Y NÚCLEO PARA AGREGAR ÍTEMS -->
        <aside class="lg:col-span-4 xl:col-span-4 h-full overflow-y-auto pr-2 space-y-3">
            <div class="flex justify-between items-center sticky top-0 bg-[#f4e7dc] py-1 z-10">
                <h2 class="text-lg font-extrabold text-[#3b291a]">Panel de Control</h2>
                <button onclick="cerrarSesion()" class="text-xs font-bold text-red-700 hover:underline bg-white px-2.5 py-1 rounded-lg border border-[#e5d3c5]">Cerrar Sesión</button>
            </div>

            <!-- FILTRO DE CATEGORÍA (ÚNICAMENTE LISTA DESPLEGABLE) -->
            <div class="filtro-card">
                <div class="filtro-titulo"><span>🏷️</span> FILTRO POR CATEGORÍA</div>
                <select id="select-categoria" class="w-full p-2.5 text-xs font-bold rounded-xl border border-[#e5d3c5] bg-white text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c] shadow-sm">
                    <option value="">-- TODAS LAS CATEGORÍAS --</option>
                </select>
            </div>

            <!-- FORMULARIO PARA AGREGAR NUEVO ÍTEM -->
            <div class="filtro-card space-y-3">
                <div class="filtro-titulo"><span>➕</span> AGREGAR NUEVO ÍTEM O PRÁCTICA</div>
                
                <form id="form-nuevo-item" onsubmit="agregarNuevoItem(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-extrabold uppercase text-[#4a3525] mb-1">Categoría</label>
                        <input 
                            type="text" 
                            id="nuevo-categoria" 
                            list="lista-categorias-autocomplete" 
                            required 
                            placeholder="Escriba o seleccione una categoría..." 
                            class="w-full p-2 text-xs font-semibold rounded-xl border border-[#e5d3c5] bg-white text-gray-800 outline-none focus:ring-2 focus:ring-[#b85a3c]"
                        >
                        <datalist id="lista-categorias-autocomplete"></datalist>
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold uppercase text-[#4a3525] mb-1">Práctica / Servicio</label>
                        <input 
                            type="text" 
                            id="nuevo-item" 
                            required 
                            placeholder="Nombre del servicio o práctica..." 
                            class="w-full p-2 text-xs font-semibold rounded-xl border border-[#e5d3c5] bg-white text-gray-800 outline-none focus:ring-2 focus:ring-[#b85a3c]"
                        >
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold uppercase text-[#4a3525] mb-1.5">Precios por Plan (Opcional)</label>
                        <div id="contenedor-precios-nuevo" class="grid grid-cols-2 gap-2 bg-white p-2.5 rounded-xl border border-[#e5d3c5] max-h-48 overflow-y-auto">
                            <!-- Los inputs de precios por plan se generan dinámicamente -->
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        class="w-full bg-[#b85a3c] hover:bg-[#964229] text-white font-extrabold py-2.5 rounded-xl text-xs shadow-md transition active:scale-95 flex items-center justify-center gap-1.5"
                    >
                        <span>➕</span> Añadir Ítem a la Base
                    </button>
                </form>
            </div>
        </aside>

        <!-- COLUMNA DERECHA: RESULTADOS Y TABLA -->
        <main class="lg:col-span-8 xl:col-span-8 h-full overflow-y-auto pr-2 flex flex-col gap-3">
            <div class="flex justify-between items-center sticky top-0 bg-[#f4e7dc] py-1 z-10">
                <h2 class="text-lg font-extrabold text-[#3b291a]">Editor Exclusivo de Precios</h2>
                
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-1.5 text-xs font-bold text-[#4a3525] cursor-pointer bg-white px-3 py-1.5 rounded-xl border border-[#e5d3c5]">
                        <input type="checkbox" id="check-modo-edicion" class="rounded text-[#b85a3c] focus:ring-[#b85a3c]">
                        <span>Habilitar Edición</span>
                    </label>

                    <button onclick="guardarEnJSON()" style="background-color: #28a745; color: white; padding: 8px 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px;" class="shadow-sm hover:opacity-90 transition">
                        💾 Guardar Cambios (precios.json)
                    </button>
                </div>
            </div>

            <div class="relative flex-shrink-0">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-base">🔍</span>
                <input
                    type="text"
                    id="input-busqueda"
                    placeholder="Buscar por práctica, código o categoría..."
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-[#e5d3c5] shadow-sm focus:ring-2 focus:ring-[#b85a3c] text-sm bg-white outline-none font-semibold text-gray-700 transition disabled:opacity-50"
                    disabled
                >
            </div>

            <div class="bg-white rounded-2xl border border-[#e5d3c5] shadow-sm overflow-hidden flex-1 flex flex-col min-h-0 mb-2">
                <div id="tabla-wrap" class="overflow-auto flex-1 p-1"></div>

                <div class="flex flex-col sm:flex-row justify-between items-center bg-[#faf6f0] px-4 py-2 border-t border-[#ede3da] text-xs gap-2 flex-shrink-0">
                    <div class="flex items-center gap-2 font-bold text-[#5c4b3f]">
                        <span id="indicador-color" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                        <span id="texto-resultados">Cargando base de datos...</span>
                    </div>
                    <div id="badge-estado" class="bg-white border border-[#e5d3c5] px-3 py-0.5 rounded-full font-bold text-[#7a6657] text-[10px] uppercase tracking-wider">
                        Conectando...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- LÓGICA DE AUTENTICACIÓN ---
        function intentarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const errorDiv = document.getElementById('mensaje-error');

            if (usuario === 'admin' && password === 'Integra2026') {
                errorDiv.classList.add('hidden');
                document.getElementById('pantalla-login').classList.add('hidden');
                document.getElementById('contenido-principal').classList.remove('hidden');
                
                if (baseDeDatos.length === 0) {
                    inicializarSistema();
                }
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function cerrarSesion() {
            document.getElementById('contenido-principal').classList.add('hidden');
            document.getElementById('pantalla-login').classList.remove('hidden');
            document.getElementById('usuario-input').value = '';
            document.getElementById('password-input').value = '';
        }

        // --- LÓGICA PRINCIPAL DEL SISTEMA DE PRECIOS ---
        function normalizar(v){ return String(v ?? '').trim(); }
        function quitarAcentos(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

        let baseDeDatos = [];
        let categoriaSeleccionada = "";
        let modoEdicion = false;
        let ORDEN_PLANES = ['IN 90', 'IN 90 (OSECAC)', 'IN 180', 'IN 360', 'AFILIADO SEC', 'ASISTENCIAL'];
        let etiquetaPorClave = {};

        function inicializarSistema() {
            fetch('precios.json')
                .then(res => {
                    if (!res.ok) throw new Error('No se pudo cargar el archivo precios.json');
                    return res.json();
                })
                .then(data => {
                    baseDeDatos = data;

                    // Extraer los nombres de los planes presentes
                    const planesSet = new Set();
                    baseDeDatos.forEach(r => {
                        if (r.precios) {
                            Object.keys(r.precios).forEach(p => planesSet.add(p));
                        }
                    });

                    // Mantener el orden prioritario
                    ORDEN_PLANES = [...planesSet].sort((a, b) => {
                        const prioridades = ['IN 90', 'IN 90 (OSECAC)', 'IN 180', 'IN 360', 'AFILIADO SEC', 'ASISTENCIAL'];
                        const ia = prioridades.indexOf(a);
                        const ib = prioridades.indexOf(b);
                        if (ia === -1 && ib === -1) return a.localeCompare(b);
                        if (ia === -1) return 1;
                        if (ib === -1) return -1;
                        return ia - ib;
                    });

                    ORDEN_PLANES.forEach(p => { etiquetaPorClave[p] = p; });

                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    document.getElementById('texto-resultados').textContent = `Base lista (${baseDeDatos.length} registros).`;
                    document.getElementById('badge-estado').textContent = 'Base Cargada';
                    document.getElementById('badge-estado').classList.add('text-emerald-600');
                    document.getElementById('input-busqueda').disabled = false;

                    poblarCategorias();
                    generarCamposPreciosNuevo();
                    aplicarBusquedaYFiltro();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                    document.getElementById('texto-resultados').textContent = 'Error al cargar precios.json';
                });
        }

        function poblarCategorias() {
            const select = document.getElementById('select-categoria');
            const datalist = document.getElementById('lista-categorias-autocomplete');

            select.innerHTML = '<option value="">-- TODAS LAS CATEGORÍAS --</option>';
            if (datalist) datalist.innerHTML = '';

            // Extraer de forma única todas las categorías
            const categoriasUnicas = [...new Set(baseDeDatos.map(r => r.categoria).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));

            categoriasUnicas.forEach(cat => {
                // Opción para el filtro selector
                const optionSelect = document.createElement('option');
                optionSelect.value = cat;
                optionSelect.textContent = cat;
                select.appendChild(optionSelect);

                // Opción para el autocompletado del formulario
                if (datalist) {
                    const optionData = document.createElement('option');
                    optionData.value = cat;
                    datalist.appendChild(optionData);
                }
            });

            select.value = categoriaSeleccionada;

            // Evento cambio de Select
            select.onchange = (e) => {
                categoriaSeleccionada = e.target.value;
                aplicarBusquedaYFiltro();
            };
        }

        function generarCamposPreciosNuevo() {
            const cont = document.getElementById('contenedor-precios-nuevo');
            if (!cont) return;
            cont.innerHTML = '';

            ORDEN_PLANES.forEach(plan => {
                const div = document.createElement('div');
                div.className = 'flex flex-col';
                div.innerHTML = `
                    <span class="text-[9px] font-bold text-gray-500 truncate" title="${plan}">${plan}</span>
                    <input 
                        type="number" 
                        step="any" 
                        data-plan="${plan}" 
                        placeholder="$ 0" 
                        class="input-precio-nuevo w-full px-2 py-1 text-xs border border-[#e5d3c5] rounded-md font-semibold text-gray-800 outline-none focus:border-[#b85a3c]"
                    >
                `;
                cont.appendChild(div);
            });
        }

        function agregarNuevoItem(e) {
            e.preventDefault();
            
            const cat = document.getElementById('nuevo-categoria').value.trim();
            const itemNombre = document.getElementById('nuevo-item').value.trim();

            if (!cat || !itemNombre) {
                alert('Por favor complete la categoría y la práctica/servicio.');
                return;
            }

            // Construir el objeto de precios ingresados
            const preciosNuevos = {};
            const inputsPrecios = document.querySelectorAll('.input-precio-nuevo');
            inputsPrecios.forEach(input => {
                const plan = input.dataset.plan;
                const val = input.value.trim();
                if (val !== '') {
                    const num = Number(val);
                    preciosNuevos[plan] = !isNaN(num) ? num : val;
                }
            });

            // Generar nuevo idRegistro incremental
            const maxId = baseDeDatos.reduce((max, r) => {
                const idNum = Number(r.idRegistro);
                return (!isNaN(idNum) && idNum > max) ? idNum : max;
            }, 0);

            const nuevoRegistro = {
                idRegistro: maxId + 1,
                categoria: cat,
                item: itemNombre,
                precios: preciosNuevos
            };

            // Agregar al principio de la base de datos para visibilidad inmediata
            baseDeDatos.unshift(nuevoRegistro);

            // Actualizar interfaz
            poblarCategorias();
            document.getElementById('nuevo-item').value = '';
            inputsPrecios.forEach(inp => inp.value = '');

            categoriaSeleccionada = cat;
            document.getElementById('select-categoria').value = cat;

            aplicarBusquedaYFiltro();
            alert(`¡Práctica "${itemNombre}" agregada con éxito a la categoría "${cat}"!\n\nRecuerde hacer clic en el botón "💾 Guardar Cambios (precios.json)" para descargar la versión actualizada del archivo.`);
        }

        function buscarEstricto(termino){
            const t = quitarAcentos(termino).toLowerCase().trim();
            if (!t) return [];
            return baseDeDatos.filter(r =>
                quitarAcentos(r.item).toLowerCase().includes(t) ||
                quitarAcentos(r.categoria).toLowerCase().includes(t)
            );
        }

        function aplicarBusquedaYFiltro(){
            const termino = document.getElementById('input-busqueda').value.trim();
            let resultados = (!termino && !categoriaSeleccionada) 
                ? baseDeDatos.slice(0, 30) 
                : (termino ? buscarEstricto(termino) : baseDeDatos.slice());

            if (categoriaSeleccionada) {
                resultados = resultados.filter(r => r.categoria === categoriaSeleccionada);
            }

            document.getElementById('texto-resultados').textContent = `Mostrando ${resultados.length} de ${baseDeDatos.length} registros.`;
            renderizarTabla(resultados);
        }

        document.getElementById('input-busqueda').addEventListener('input', aplicarBusquedaYFiltro);
        
        document.getElementById('check-modo-edicion').addEventListener('change', (e) => {
            modoEdicion = e.target.checked;
            aplicarBusquedaYFiltro();
        });

        function formatearValor(valor){
            if (typeof valor === 'number') return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
            const numero = parseFloat(normalizar(valor).replace(',', '.'));
            return !isNaN(numero) ? new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(numero) : valor;
        }

        function actualizarPrecioEnBase(idReg, clavePlan, nuevoValor) {
            const reg = baseDeDatos.find(r => r.idRegistro === idReg);
            if (reg) {
                if (!reg.precios) reg.precios = {};
                if (nuevoValor === '' || nuevoValor === null) {
                    delete reg.precios[clavePlan];
                } else {
                    const numVal = Number(nuevoValor);
                    reg.precios[clavePlan] = (!isNaN(numVal) && nuevoValor.trim() !== '') ? numVal : nuevoValor;
                }
            }
        }

        function renderizarTabla(datos) {
            const contenedor = document.getElementById('tabla-wrap');
            if (!datos || datos.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-12"><p class="text-gray-400 font-bold text-base">No se encontraron resultados.</p></div>`;
                return;
            }

            const columnas = ORDEN_PLANES;
            const theadHTML = `<tr><th>Práctica / Servicio</th>${columnas.map((clave) => `<th>${clave.toUpperCase()}</th>`).join('')}</tr>`;
            
            const tbodyHTML = datos.map((r) => `
                <tr>
                    <td class="celda-item"><span class="celda-categoria">${r.categoria}</span><br>${r.item}</td>
                    ${columnas.map((clave) => {
                        const tiene = r.precios && r.precios[clave] !== undefined;
                        const valorActual = tiene ? r.precios[clave] : '';

                        if (modoEdicion) {
                            return `<td>
                                <input 
                                    type="text" 
                                    class="input-precio-edit" 
                                    value="${valorActual}" 
                                    onchange="actualizarPrecioEnBase(${r.idRegistro}, '${clave}', this.value)"
                                >
                            </td>`;
                        } else {
                            return `<td class="${!tiene ? 'celda-vacia' : ''}">${tiene ? formatearValor(valorActual) : '—'}</td>`;
                        }
                    }).join('')}
                </tr>`).join('');

            contenedor.innerHTML = `<table><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
        }

        function guardarEnJSON() {
            if (!baseDeDatos || baseDeDatos.length === 0) {
                alert("No hay datos cargados para exportar.");
                return;
            }

            const jsonString = JSON.stringify(baseDeDatos, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = "precios.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert("¡Archivo 'precios.json' actualizado y descargado con éxito!");
        }
    </script>
</body>
</html>
