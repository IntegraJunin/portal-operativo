<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA - Editor de Precios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Mismos estilos base, pero con inputs destacados para edición */
        .input-precio-edit {
            width: 100%;
            max-width: 120px;
            padding: 4px 8px;
            border: 1px solid #b85a3c;
            border-radius: 6px;
            font-weight: 700;
            color: #3b291a;
            background-color: #fffbeb;
            outline: none;
            transition: all 0.2s;
        }
        .input-precio-edit:focus {
            box-shadow: 0 0 0 2px rgba(184, 90, 60, 0.3);
            background-color: #ffffff;
        }
    </style>
</head>
<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden bg-[#f4e7dc] font-outfit">

    <div class="flex-1 flex flex-col gap-4 min-h-0 overflow-hidden">
        <!-- HEADER EDITOR -->
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl border border-[#e5d3c5] shadow-sm">
            <div>
                <h1 class="text-xl font-extrabold text-[#3b291a]">Panel de Edición de Precios</h1>
                <p class="text-xs text-gray-500 font-semibold mt-1">Los cambios se guardarán directamente en el formato Excel.</p>
            </div>
            
            <div class="flex gap-3">
                <button onclick="agregarNuevaFila()" class="bg-[#4a3525] hover:bg-[#3b291a] text-white font-extrabold px-4 py-2 rounded-xl text-sm transition">
                    + Nuevo Registro
                </button>
                <button id="btn-guardar-excel" onclick="exportarExcel()" class="bg-[#b85a3c] hover:bg-[#964229] text-white font-extrabold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shadow transition">
                    <span>💾</span> Guardar como .xlsx
                </button>
            </div>
        </header>

        <!-- TABLA EDITABLE -->
        <main class="bg-white rounded-2xl border border-[#e5d3c5] shadow-sm overflow-hidden flex-1 flex flex-col">
            <div id="tabla-wrap" class="overflow-auto flex-1 p-2">
                <!-- La tabla se renderizará aquí con campos <input> en lugar de texto plano -->
            </div>
        </main>
    </div>

    <script>
        // Lógica de carga de Excel similar a editor_2.html
        
        function renderizarTablaEditable(datos) {
            // A diferencia del buscador, aquí inyectamos inputs en cada celda
            const tbodyHTML = datos.map((registro, fila) => {
                const celdasInputs = ORDEN_PLANES.map(clave => {
                    const valor = registro.precios[clave] || '';
                    return `<td>
                        <input type="number" 
                               class="input-precio-edit" 
                               value="${valor}" 
                               data-fila="${fila}" 
                               data-col="${clave}"
                               onchange="actualizarPrecio(${fila}, '${clave}', this.value)">
                    </td>`;
                }).join('');

                return `
                    <tr>
                        <td class="font-bold text-[#3b291a] p-2 border-b border-[#f2e9e1]">
                            <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 mb-1 text-xs" value="${registro.categoria}">
                            <input type="text" class="w-full border border-gray-300 rounded px-2 py-1 font-bold" value="${registro.item}">
                        </td>
                        ${celdasInputs}
                    </tr>`;
            }).join('');
            
            // ... inyectar en el DOM ...
        }

        function exportarExcel() {
            // Lógica para tomar la variable 'baseDeDatos' actualizada y usar XLSX.write()
            const ws = XLSX.utils.json_to_sheet(formatearParaExportacion(baseDeDatos));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Precios Actualizados");
            XLSX.writeFile(wb, "precios_modificado.xlsx");
        }
    </script>
</body>
</html>
