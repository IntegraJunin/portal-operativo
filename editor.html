<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA - Acceso Seguro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f4e7dc;
            --bg-card: #ffffff;
            --bg-box: #fbf5ef;
            --border-box: #e5d3c5;
            --text-brand: #4a3525;
            --chip-bg: #e8dad0;
            --chip-text: #4a3525;
            --chip-active-bg: #4a382a;
            --chip-active-text: #ffffff;
            --accent-orange: #b85a3c;
        }

        html, body {
            height: 100vh !important;
            max-height: 100vh !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background-color: var(--bg-main);
            font-family: 'Comfortaa', cursive;
            color: var(--text-brand);
        }

        h1, h2, h3, button, input, select, table, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0beb0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a698; }

        .chip-filtro {
            background-color: var(--chip-bg);
            color: var(--chip-text);
            font-weight: 700;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 9999px;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            border: 1px solid transparent;
        }

        .chip-filtro:hover { background-color: #ded0c5; }
        .chip-filtro.activo {
            background-color: var(--chip-active-bg) !important;
            color: var(--chip-active-text) !important;
            border-color: var(--chip-active-bg);
        }

        .filtro-card {
            background-color: var(--bg-box);
            border: 1.5px solid var(--border-box);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .filtro-titulo {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-brand);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #tabla-wrap table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 550px;
        }

        #tabla-wrap th, #tabla-wrap td {
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
        }

        #tabla-wrap thead th {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #7a6657;
            background: #faf6f0;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #ede3da;
            z-index: 10;
        }

        #tabla-wrap tbody td:first-child, #tabla-wrap thead th:first-child {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 1;
            white-space: normal;
            min-width: 220px;
        }

        #tabla-wrap thead th:first-child { background: #faf6f0; z-index: 20; }
        #tabla-wrap tbody tr:nth-child(even) td { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:nth-child(even) td:first-child { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:hover td { background-color: #f3e9e0; }

        #tabla-wrap tbody td {
            border-bottom: 1px solid #f2e9e1;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #3d2e24;
            font-size: 13px;
        }

        #tabla-wrap .celda-item { font-weight: 700; color: #3b291a; }
        #tabla-wrap .celda-categoria {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: var(--accent-orange);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
        }

        #tabla-wrap .celda-vacia { color: #c0b2a6; font-weight: 600; }
        
        .input-precio-edit {
            width: 100%;
            max-width: 110px;
            padding: 3px 6px;
            border: 1px solid #b85a3c;
            border-radius: 6px;
            font-weight: 700;
            color: #3b291a;
            background-color: #fffbeb;
            outline: none;
        }
    </style>
</head>
<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden">

    <!-- PANTALLA DE LOGIN (MODAL / OVERLAY) -->
    <div id="pantalla-login" class="fixed inset-0 z-50 bg-[#f4e7dc] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl border border-[#e5d3c5] shadow-xl p-8 w-full max-w-md flex flex-col items-center">
            <div class="w-16 h-16 bg-[#fbf5ef] border border-[#e5d3c5] rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-sm">
                🔐
            </div>
            <h1 class="text-xl font-extrabold text-[#3b291a] text-center mb-1">Portal Operativo INTEGRA</h1>
            <p class="text-xs font-semibold text-gray-500 text-center mb-6">Ingrese sus credenciales de administrador para continuar</p>

            <form id="form-login" class="w-full space-y-4" onsubmit="intentarLogin(event)">
                <div>
                    <label class="block text-xs font-extrabold text-[#4a3525] uppercase tracking-wider mb-1.5">Usuario</label>
                    <input type="text" id="usuario-input" required placeholder="Ej. admin" class="w-full px-4 py-2.5 rounded-xl border border-[#e5d3c5] bg-[#faf6f0] text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c]">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-[#4a3525] uppercase tracking-wider mb-1.5">Contraseña</label>
                    <input type="password" id="password-input" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-[#e5d3c5] bg-[#faf6f0] text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c]">
                </div>

                <div id="mensaje-error" class="text-xs font-bold text-red-600 text-center hidden">
                    Usuario o contraseña incorrectos.
                </div>

                <button type="submit" class="w-full bg-[#b85a3c] hover:bg-[#964229] text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition transform active:scale-95">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (OCULTO HASTA AUTENTICARSE) -->
    <div id="contenido-principal" class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-0 overflow-hidden hidden">
        <!-- COLUMNA IZQUIERDA: FILTROS -->
        <aside class="lg:col-span-4 xl:col-span-4 h-full overflow-y-auto pr-2 space-y-3">
            <div class="flex justify-between items-center sticky top-0 bg-[#f4e7dc] py-1 z-10">
                <h2 class="text-lg font-extrabold text-[#3b291a]">Filtros</h2>
                <button onclick="cerrarSesion()" class="text-xs font-bold text-red-700 hover:underline bg-white px-2.5 py-1 rounded-lg border border-[#e5d3c5]">Cerrar Sesión</button>
            </div>

            <div class="filtro-card">
                <div class="filtro-titulo"><span>🏷️</span> FILTRO POR CATEGORÍA (EXCEL)</div>
                <select id="select-categoria" class="w-full p-2 text-xs font-bold rounded-xl border border-[#e5d3c5] bg-white text-gray-700 outline-none focus:ring-2 focus:ring-[#b85a3c]">
                    <option value="">-- TODAS LAS CATEGORÍAS --</option>
                </select>
            </div>

            <div class="filtro-card">
                <div class="filtro-titulo"><span>👤</span> FILTRO POR TIPO DE SOCIO</div>
                <div id="fila-filtros" class="flex flex-wrap gap-1.5"></div>
            </div>

            <div class="filtro-card">
                <div class="filtro-titulo"><span>🟠</span> FILTRO POR CONVENIO</div>
                <div id="fila-convenios" class="flex flex-wrap gap-1.5"></div>
            </div>

            <div id="contenedor-servicios" class="space-y-3"></div>
        </aside>

        <!-- COLUMNA DERECHA: RESULTADOS Y TABLA -->
        <main class="lg:col-span-8 xl:col-span-8 h-full overflow-y-auto pr-2 flex flex-col gap-3">
            <div class="flex justify-between items-center sticky top-0 bg-[#f4e7dc] py-1 z-10">
                <h2 class="text-lg font-extrabold text-[#3b291a]">Resultados y Edición</h2>
                
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-1.5 text-xs font-bold text-[#4a3525] cursor-pointer">
                        <input type="checkbox" id="check-modo-edicion" class="rounded text-[#b85a3c] focus:ring-[#b85a3c]">
                        <span>Habilitar Edición</span>
                    </label>

                    <button id="btn-guardar-excel" class="bg-[#b85a3c] hover:bg-[#964229] text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow transition">
                        <span>💾</span> Guardar Excel (.xlsx)
                    </button>
                </div>
            </div>

            <div class="relative flex-shrink-0">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-base">🔍</span>
                <input
                    type="text"
                    id="input-busqueda"
                    placeholder="Buscar por práctica, código o especialidad..."
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-[#e5d3c5] shadow-sm focus:ring-2 focus:ring-[#b85a3c] text-sm bg-white outline-none font-semibold text-gray-700 transition disabled:opacity-50"
                    disabled
                >
            </div>

            <div class="bg-white rounded-2xl border border-[#e5d3c5] shadow-sm overflow-hidden flex-1 flex flex-col min-h-0 mb-2">
                <div id="tabla-wrap" class="overflow-auto flex-1 p-1"></div>

                <div class="flex flex-col sm:flex-row justify-between items-center bg-[#faf6f0] px-4 py-2 border-t border-[#ede3da] text-xs gap-2 flex-shrink-0">
                    <div class="flex items-center gap-2 font-bold text-[#5c4b3f]">
                        <span id="indicador-color" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                        <span id="texto-resultados">Cargando base de datos...</span>
                    </div>
                    <div id="badge-estado" class="bg-white border border-[#e5d3c5] px-3 py-0.5 rounded-full font-bold text-[#7a6657] text-[10px] uppercase tracking-wider">
                        Conectando...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- LÓGICA DE AUTENTICACIÓN ---
        function intentarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const errorDiv = document.getElementById('mensaje-error');

            if (usuario === 'admin' && password === 'Integra2026') {
                errorDiv.classList.add('hidden');
                document.getElementById('pantalla-login').classList.add('hidden');
                document.getElementById('contenido-principal').classList.remove('hidden');
                
                // Disparar carga de la base si aún no se cargó
                if (baseDeDatos.length === 0) {
                    inicializarSistema();
                }
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function cerrarSesion() {
            document.getElementById('contenido-principal').classList.add('hidden');
            document.getElementById('pantalla-login').classList.remove('hidden');
            document.getElementById('usuario-input').value = '';
            document.getElementById('password-input').value = '';
        }

        // --- LÓGICA PRINCIPAL DEL SISTEMA DE PRECIOS ---
        const PLANES_SIEMPRE_BLOQUEADOS = ['AD', 'COS', 'MM', 'MM/COM', 'MON/OP NO COS'];

        function normalizar(v){ return String(v ?? '').trim(); }
        function claveComparable(v){ return normalizar(v).replace(/\s+/g, ' ').toUpperCase(); }
        function quitarAcentos(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
        function normalizarCategoria(s){ return quitarAcentos(normalizar(s)).replace(/\s+/g, ' ').toUpperCase(); }

        let ORDEN_PLANES = [];
        const PRIORIDAD_ORDEN = ['IN 90', 'IN 90 (OSECAC)', 'IN 180', 'IN 360', 'AFILIADO SEC', 'ASISTENCIAL'];

        function ordenarPlanes(claves){
            return [...claves].sort((a, b) => {
                const ia = PRIORIDAD_ORDEN.indexOf(a);
                const ib = PRIORIDAD_ORDEN.indexOf(b);
                if (ia === -1 && ib === -1) return 0;
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        let baseDeDatos = [];
        let filtroActivo = null;
        let categoriaSeleccionada = "";
        let modoEdicion = false;

        async function descargarExcel() {
            const variantes = ['precios(modificado).xlsx', 'precios.xlsx', 'PRECIOS.xlsx'];
            for (const url of variantes) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'array', data: await res.arrayBuffer() };
                } catch (e) {}
            }
            throw new Error('No se pudo encontrar el archivo excel');
        }

        const PALABRAS_CLAVE_IN90_PERMITIDO = ['TURISMO', 'QUINCHO', 'SALON', 'PILETA', 'COLONIA', 'MUSICA', 'FUTBOL'];
        function in90PermitidoEnCategoria(categoria){
            const cat = normalizarCategoria(categoria);
            return PALABRAS_CLAVE_IN90_PERMITIDO.some(kw => cat.includes(kw));
        }

        const PALABRAS_CLAVE_EXCLUIDAS_IN180 = ['COMED', 'FAMYL', 'PETRAGLIA', 'PSIQUIATRIA'];
        function in180PermitidoEn(categoria, item){
            const cat = normalizarCategoria(categoria);
            const it = normalizarCategoria(item);
            if (PALABRAS_CLAVE_EXCLUIDAS_IN180.some(kw => cat.includes(kw))) return false;
            if (it.includes('CONVENIO')) return false;
            if (it.startsWith('CONSULTA MEDICA')) return false;
            return true;
        }

        let etiquetaPorClave = {};

        function parsearFilas(filas){
            const registros = [];
            let mapaColumnas = {};
            etiquetaPorClave = {};
            ORDEN_PLANES = [];

            let filaHeaderIndex = 0;
            for(let i=0; i < filas.length; i++) {
                if(filas[i][3]) { 
                    filaHeaderIndex = i;
                    break;
                }
            }

            const headerRow = filas[filaHeaderIndex];
            
            for (let c = 3; c < headerRow.length; c++) {
                const nombrePlan = normalizar(headerRow[c]);
                if (nombrePlan) {
                    const clave = claveComparable(nombrePlan);
                    mapaColumnas[c] = clave;
                    if (!(clave in etiquetaPorClave)) {
                        etiquetaPorClave[clave] = nombrePlan;
                        ORDEN_PLANES.push(clave);
                    }
                }
            }

            let categoriaActual = 'GENERAL';

            for (let i = filaHeaderIndex + 1; i < filas.length; i++) {
                const fila = filas[i];
                if (!fila || fila.length === 0) continue;

                const colCategoria = normalizar(fila[0]);
                const colItem = normalizar(fila[1]);
                const colDetalle = normalizar(fila[2]);

                if (colCategoria) categoriaActual = colCategoria;
                if (!colItem) continue;

                const nombreItemFinal = colDetalle ? `${colItem} (${colDetalle})` : colItem;
                const precios = {};

                Object.entries(mapaColumnas).forEach(([colIndex, clave]) => {
                    const valor = fila[Number(colIndex)];
                    if (valor !== undefined && valor !== '' && valor !== null && valor !== 'NaN') {
                        precios[clave] = valor;
                    }
                });

                if (Object.keys(precios).length === 0) continue;

                PLANES_SIEMPRE_BLOQUEADOS.forEach(clave => { delete precios[clave]; });
                if ('IN 90' in precios && !in90PermitidoEnCategoria(categoriaActual)) {
                    delete precios['IN 90'];
                }
                if ('IN 180' in precios && !in180PermitidoEn(categoriaActual, nombreItemFinal)) {
                    delete precios['IN 180'];
                }

                if (Object.keys(precios).length === 0) continue;

                registros.push({ 
                    idRegistro: registros.length,
                    item: nombreItemFinal, 
                    itemOriginal: colItem,
                    detalle: colDetalle,
                    categoria: categoriaActual, 
                    precios 
                });
            }
            ORDEN_PLANES = ordenarPlanes(ORDEN_PLANES);
            return registros;
        }

        function inicializarSistema() {
            descargarExcel()
                .then(({ data }) => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const primeraHoja = workbook.Sheets[workbook.SheetNames[0]];
                    const filas = XLSX.utils.sheet_to_json(primeraHoja, { header: 1, defval: null });

                    if (filas.length === 0) throw new Error('El Excel está vacío');

                    baseDeDatos = parsearFilas(filas);
                    
                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    document.getElementById('texto-resultados').textContent = `Base lista (${baseDeDatos.length} registros).`;
                    document.getElementById('badge-estado').textContent = 'Base Cargada';
                    document.getElementById('badge-estado').classList.add('text-emerald-600');
                    document.getElementById('input-busqueda').disabled = false;

                    poblarDesplegableCategorias();
                    renderizarFiltros();
                    renderizarFiltroConvenios();
                    renderizarFiltroServicios();
                    aplicarBusquedaYFiltro();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                    document.getElementById('texto-resultados').textContent = 'Error al cargar precios.xlsx';
                });
        }

        function poblarDesplegableCategorias() {
            const select = document.getElementById('select-categoria');
            const categoriasUnicas = [...new Set(baseDeDatos.map(r => r.categoria))].sort();

            categoriasUnicas.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                categoriaSeleccionada = e.target.value;
                aplicarBusquedaYFiltro();
            });
        }

        function buscarEstricto(termino){
            const t = quitarAcentos(termino).toLowerCase().trim();
            if (!t) return [];
            return baseDeDatos.filter(r =>
                quitarAcentos(r.item).toLowerCase().includes(t) ||
                quitarAcentos(r.categoria).toLowerCase().includes(t)
            );
        }

        function aplicarBusquedaYFiltro(){
            const termino = document.getElementById('input-busqueda').value.trim();
            let resultados = (!termino && !filtroActivo && !convenioActivo && !servicioActivo && !categoriaSeleccionada) 
                ? baseDeDatos.slice(0, 20) 
                : (termino ? buscarEstricto(termino) : baseDeDatos.slice());

            if (categoriaSeleccionada) resultados = resultados.filter(r => r.categoria === categoriaSeleccionada);
            if (filtroActivo) resultados = resultados.filter(r => Object.prototype.hasOwnProperty.call(r.precios, filtroActivo));
            if (convenioActivo) resultados = resultados.filter(r => convenioActivo.coincide(r.categoria));
            if (servicioActivo) resultados = resultados.filter(r => servicioActivo.coincide(r.item, r.categoria));

            renderizarTabla(resultados, filtroActivo);
        }

        const CONVENIOS_FIJOS = [
            { nombre: 'DRA. CAPPONI', claves: ['CAPPONI'] },
            { nombre: 'COMED', claves: ['COMED'] },
            { nombre: 'CMD (FAMY)', claves: ['CMD', 'FAMYL'] },
            { nombre: 'DR. COSTANZI', claves: ['COSTANZI'] },
            { nombre: 'NEXO TERAPIA', claves: ['NEXO TERAPIA', 'NEXO'] },
        ].map(c => ({ ...c, coincide: (cat) => c.claves.some(k => normalizarCategoria(cat).includes(k))}));

        let convenioActivo = null;
        function renderizarFiltroConvenios(){
            const cont = document.getElementById('fila-convenios');
            cont.innerHTML = `<button class="chip-filtro activo" data-convenio="">TODOS</button>` +
                CONVENIOS_FIJOS.map((c, i) => `<button class="chip-filtro" data-convenio="${i}">${c.nombre}</button>`).join('');

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    convenioActivo = btn.dataset.convenio !== '' ? CONVENIOS_FIJOS[Number(btn.dataset.convenio)] : null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    aplicarBusquedaYFiltro();
                });
            });
        }

        function esConsultaDeLetra(it, cat, letra){
            const txt = quitarAcentos(it).toUpperCase();
            const p = txt.split(/\s+/).filter(Boolean);
            if(!p.includes('CONSULTA')) return false;
            if(['ODONTO','KINESIO','NUTRI','ENFERM'].some(kw => p.some(pal=>pal.includes(kw)))) return false;
            return p.includes(letra) && !['A','B','C'].filter(l => l!==letra).some(l=>p.includes(l));
        }

        const SERVICIOS_GRUPOS = [
            { titulo: '🩺 CONSULTA MÉDICA', items: [
                { id: 'ca', nombre: 'CONSULTA "A"', coincide: (i,c) => esConsultaDeLetra(i,c,'A') },
                { id: 'cb', nombre: 'CONSULTA "B"', coincide: (i,c) => esConsultaDeLetra(i,c,'B') },
                { id: 'cc', nombre: 'CONSULTA "C"', coincide: (i,c) => esConsultaDeLetra(i,c,'C') },
                { id: 'nu', nombre: 'NUTRICION', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('NUTRICI') }
            ]},
            { titulo: '🩺 OTRAS CONSULTAS', items: [
                { id: 'co', nombre: 'ODONTO', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('ODONTO') },
                { id: 'ki', nombre: 'KINESIOLOGIA', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('KINESIO') }
            ]},
            { titulo: '🏛️ SALONES Y RECREACIÓN', items: [
                { id: 'qu', nombre: 'QUINCHOS', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('QUINCHO') },
                { id: 's1', nombre: 'SALONES', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('SALON') },
                { id: 'pi', nombre: 'PILETA', coincide: (i,c) => quitarAcentos(i+' '+c).toUpperCase().includes('PILETA') }
            ]}
        ];

        let servicioActivo = null;
        function renderizarFiltroServicios(){
            const cont = document.getElementById('contenedor-servicios');
            cont.innerHTML = SERVICIOS_GRUPOS.map((g, gIdx) => `
                <div class="filtro-card">
                    <div class="filtro-titulo">${g.titulo}</div>
                    <div class="flex flex-wrap gap-1.5">
                        <button class="chip-filtro activo" data-grupo="${gIdx}" data-servicio="">TODOS</button>
                        ${g.items.map(it => `<button class="chip-filtro" data-grupo="${gIdx}" data-servicio="${it.id}">${it.nombre}</button>`).join('')}
                    </div>
                </div>`).join('');

            const todosItems = SERVICIOS_GRUPOS.flatMap(g => g.items);
            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.servicio;
                    servicioActivo = id ? todosItems.find(it => it.id === id) : null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));

                    if (servicioActivo) {
                        btn.classList.add('activo');
                        SERVICIOS_GRUPOS.forEach((g, idx) => {
                            if (String(idx) !== btn.dataset.grupo) {
                                cont.querySelector(`.chip-filtro[data-grupo="${idx}"][data-servicio=""]`)?.classList.add('activo');
                            }
                        });
                    } else {
                        SERVICIOS_GRUPOS.forEach((g, idx) => {
                            cont.querySelector(`.chip-filtro[data-grupo="${idx}"][data-servicio=""]`)?.classList.add('activo');
                        });
                    }
                    aplicarBusquedaYFiltro();
                });
            });
        }

        document.getElementById('input-busqueda').addEventListener('input', aplicarBusquedaYFiltro);
        
        document.getElementById('check-modo-edicion').addEventListener('change', (e) => {
            modoEdicion = e.target.checked;
            aplicarBusquedaYFiltro();
        });

        function renderizarFiltros(){
            const planesPresentes = new Set();
            baseDeDatos.forEach(r => Object.keys(r.precios).forEach(p => planesPresentes.add(p)));

            const cont = document.getElementById('fila-filtros');
            cont.innerHTML = `<button class="chip-filtro activo" data-plan="">TODOS</button>` +
                ORDEN_PLANES.filter(p => planesPresentes.has(p)).map(clave => 
                    `<button class="chip-filtro" data-plan="${clave}">${etiquetaPorClave[clave] || clave}</button>`
                ).join('');

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroActivo = btn.dataset.plan || null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    aplicarBusquedaYFiltro();
                });
            });
        }

        function formatearValor(valor){
            if (typeof valor === 'number') return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
            const numero = parseFloat(normalizar(valor).replace(',', '.'));
            return !isNaN(numero) ? new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(numero) : valor;
        }

        function actualizarPrecioEnBase(idReg, clavePlan, nuevoValor) {
            const reg = baseDeDatos.find(r => r.idRegistro === idReg);
            if (reg) {
                if (nuevoValor === '' || nuevoValor === null) {
                    delete reg.precios[clavePlan];
                } else {
                    reg.precios[clavePlan] = nuevoValor;
                }
            }
        }

        function renderizarTabla(datos, planFiltrado) {
            const contenedor = document.getElementById('tabla-wrap');
            if (datos.length === 0) {
                contenedor.innerHTML = `<div class="text-center py-12"><p class="text-gray-400 font-bold text-base">No se encontraron resultados.</p></div>`;
                return;
            }

            const columnas = planFiltrado ? [planFiltrado] : ORDEN_PLANES.filter(clave => datos.some(r => r.precios[clave]));
            const theadHTML = `<tr><th>Práctica / Servicio</th>${columnas.map((clave, i) => `<th data-col="${i}">${(etiquetaPorClave[clave] || clave).toUpperCase()}</th>`).join('')}</tr>`;
            
            const tbodyHTML = datos.map((r) => `
                <tr>
                    <td class="celda-item"><span class="celda-categoria">${r.categoria}</span><br>${r.item}</td>
                    ${columnas.map((clave) => {
                        const tiene = r.precios[clave] !== undefined;
                        const valorActual = tiene ? r.precios[clave] : '';

                        if (modoEdicion) {
                            return `<td>
                                <input 
                                    type="text" 
                                    class="input-precio-edit" 
                                    value="${valorActual}" 
                                    onchange="actualizarPrecioEnBase(${r.idRegistro}, '${clave}', this.value)"
                                >
                            </td>`;
                        } else {
                            return `<td class="${!tiene ? 'celda-vacia' : ''}">${tiene ? formatearValor(valorActual) : '—'}</td>`;
                        }
                    }).join('')}
                </tr>`).join('');

            contenedor.innerHTML = `<table><thead>${theadHTML}</thead><tbody>${tbodyHTML}</tbody></table>`;
        }

        document.getElementById('btn-guardar-excel').addEventListener('click', () => {
            guardarEnExcelPermanente();
        });

       function guardarEnExcelPermanente() {
            const wb = XLSX.utils.book_new();
            const datosArray = [];

            // 1. Array con los nombres EXACTOS y en el ORDEN EXACTO del precios.xlsx original
            const encabezadosOriginales = ['In 90', 'In 180', 'In 360', 'Afiliado SEC', 'Asistencial', 'In 90 (OSECAC)'];
            
            // 2. Las primeras tres columnas van vacías ("") para igualar el formato original
            datosArray.push(["", "", "", ...encabezadosOriginales]);

            baseDeDatos.forEach(reg => {
                const fila = [
                    reg.categoria,
                    reg.itemOriginal || reg.item, // Se mantiene el ítem original
                    reg.detalle || ""
                ];

                // 3. Extraemos el precio usando la clave normalizada, iterando en el orden correcto
                encabezadosOriginales.forEach(encabezado => {
                    // Normalizamos el encabezado original para buscar en reg.precios (ej: "IN 90 (OSECAC)")
                    const clave = claveComparable(encabezado);
                    
                    // Si el valor existe, lo agregamos. Si no, dejamos la celda vacía
                    fila.push(reg.precios[clave] !== undefined ? reg.precios[clave] : "");
                });

                datosArray.push(fila);
            });

            const ws = XLSX.utils.aoa_to_sheet(datosArray);
            
            // 4. Ajustar los anchos de columna para que sean lo más fieles posible al original
            ws['!cols'] = [ 
                {wch: 25}, // Categoría
                {wch: 45}, // Ítem
                {wch: 20}, // Detalle
                {wch: 12}, // In 90
                {wch: 12}, // In 180
                {wch: 12}, // In 360
                {wch: 15}, // Afiliado SEC
                {wch: 15}, // Asistencial
                {wch: 18}  // In 90 (OSECAC)
            ];
            
            // Nombre de la hoja idéntico al precios.xlsx original
            XLSX.utils.book_append_sheet(wb, ws, "JUNIO 2026 (2)"); 
            XLSX.writeFile(wb, "precios.xlsx");

            alert("¡Archivo generado con éxito! Guarda el descargado 'precios.xlsx' reemplazando tu archivo actual.");   
        }
    </script>
</body>
