    <title>Portal Operativo INTEGRA - Buscador de Precios</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f4e7dc;
            --bg-card: #ffffff;
            --bg-box: #fbf5ef;
            --border-box: #e5d3c5;
            --text-brand: #4a3525;
            --chip-bg: #e8dad0;
            --chip-text: #4a3525;
            --chip-active-bg: #4a382a;
            --chip-active-text: #ffffff;
            --accent-orange: #b85a3c;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            font-family: 'Comfortaa', cursive;
            color: var(--text-brand);
        }

        h1, h2, h3, button, input, table, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0beb0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a698; }

        .chip-filtro {
            background-color: var(--chip-bg);
            color: var(--chip-text);
            font-weight: 700;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 9999px;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            border: 1px solid transparent;
        }

        .chip-filtro:hover { background-color: #ded0c5; }
        .chip-filtro.activo {
            background-color: var(--chip-active-bg) !important;
            color: var(--chip-active-text) !important;
            border-color: var(--chip-active-bg);
        }

        .filtro-card {
            background-color: var(--bg-box);
            border: 1.5px solid var(--border-box);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .filtro-titulo {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-brand);
            margin-bottom: 8px;
