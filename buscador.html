<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA - Buscador de Precios</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f4e7dc;
            --bg-card: #ffffff;
            --bg-box: #fbf5ef;
            --border-box: #e5d3c5;
            --text-brand: #4a3525;
            --chip-bg: #e8dad0;
            --chip-text: #4a3525;
            --chip-active-bg: #4a382a;
            --chip-active-text: #ffffff;
            --accent-orange: #b85a3c;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            font-family: 'Comfortaa', cursive;
            color: var(--text-brand);
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3, button, input, table, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0beb0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a698; }

        .chip-filtro {
            background-color: var(--chip-bg);
            color: var(--chip-text);
            font-weight: 700;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 9999px;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            border: 1px solid transparent;
        }

        .chip-filtro:hover { background-color: #ded0c5; }
        .chip-filtro.activo {
            background-color: var(--chip-active-bg) !important;
            color: var(--chip-active-text) !important;
            border-color: var(--chip-active-bg);
        }

        .filtro-card {
            background-color: var(--bg-box);
            border: 1.5px solid var(--border-box);
            border-radius: 12px;
            padding: 8px 10px;
        }

        .filtro-titulo {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-brand);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #tabla-wrap table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 550px;
        }

        #tabla-wrap th, #tabla-wrap td {
            padding: 10px 14px;
            text-align: left;
            white-space: nowrap;
        }

        #tabla-wrap thead th {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #7a6657;
            background: #faf6f0;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #ede3da;
            z-index: 10;
        }

        #tabla-wrap tbody td:first-child, #tabla-wrap thead th:first-child {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 1;
            white-space: normal;
            min-width: 220px;
        }

        #tabla-wrap thead th:first-child { background: #faf6f0; z-index: 20; }
        #tabla-wrap tbody tr:nth-child(even) td { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:nth-child(even) td:first-child { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:hover td { background-color: #f3e9e0; }

        #tabla-wrap tbody td {
            border-bottom: 1px solid #f2e9e1;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #3d2e24;
            cursor: pointer;
            font-size: 13px;
        }

        #tabla-wrap .celda-item { font-weight: 700; color: #3b291a; cursor: default; }
        #tabla-wrap .celda-categoria {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: var(--accent-orange);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
        }

        #tabla-wrap .celda-vacia { color: #c0b2a6; font-weight: 600; cursor: default; }
        #tabla-wrap td.resaltada, #tabla-wrap th.resaltada {
            background-color: #fde047 !important;
            box-shadow: inset 0 0 0 2px #f59e0b;
            color: #3a332c !important;
        }
    </style>
</head>
<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden">

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 h-full min-h-0">
        <!-- COLUMNA IZQUIERDA: FILTROS CON SCROLL INDEPENDIENTE -->
        <aside class="lg:col-span-5 xl:col-span-4 h-full flex flex-col pr-1 gap-2 min-h-0 overflow-hidden">
            
            <!-- SECCIÓN FIJA SUPERIOR (TIPO DE SOCIO) -->
            <div class="flex-shrink-0 bg-[#f4e7dc] z-10 pb-1">
                <h2 class="text-lg font-extrabold text-[#3b291a] py-1">Filtros</h2>
                
                <div class="filtro-card mt-1 shadow-sm border-[#d2bfae]">
                    <div class="filtro-titulo"><span>👤</span> FILTRO POR TIPO DE SOCIO</div>
                    <div id="fila-filtros" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <!-- SECCIÓN SCROLLEABLE INFERIOR DE FILTROS -->
            <div class="flex-1 overflow-y-auto space-y-3 pb-8 pr-2 min-h-0">
                <!-- 2. CUOTAS -->
                <div id="card-cuotas" class="filtro-card">
                    <div class="filtro-titulo"><span>💳</span> CUOTAS</div>
                    <div id="fila-cuotas" class="flex flex-wrap gap-1.5"></div>
                </div>

                <!-- 3. CONVENIOS -->
                <div id="card-convenios" class="filtro-card">
                    <div class="filtro-titulo"><span>🟠</span> FILTRO POR CONVENIO</div>
                    <div id="fila-convenios" class="flex flex-wrap gap-1.5"></div>
                </div>

                <!-- RESTO DE SERVICIOS -->
                <div id="contenedor-servicios" class="space-y-3"></div>
            </div>
        </aside>

        <!-- COLUMNA DERECHA: RESULTADOS Y TABLA CON SCROLL INDEPENDIENTE -->
        <main class="lg:col-span-7 xl:col-span-8 h-full overflow-hidden flex flex-col gap-3 min-h-0">
            <h2 class="text-lg font-extrabold text-[#3b291a] sticky top-0 bg-[#f4e7dc] py-1 z-10">Resultados</h2>

            <div class="relative flex-shrink-0">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-base">🔍</span>
                <input
                    type="text"
                    id="input-busqueda"
                    placeholder="Buscar por práctica, código o especialidad..."
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-[#e5d3c5] shadow-sm focus:ring-2 focus:ring-[#b85a3c] text-sm bg-white outline-none font-semibold text-gray-700 transition disabled:opacity-50"
                    disabled
                >
            </div>

            <div class="bg-white rounded-2xl border border-[#e5d3c5] shadow-sm overflow-hidden flex-1 flex flex-col min-h-0 mb-2">
                <div id="tabla-wrap" class="overflow-auto flex-1 p-1"></div>

                <div class="flex flex-col sm:flex-row justify-between items-center bg-[#faf6f0] px-4 py-2 border-t border-[#ede3da] text-xs gap-2 flex-shrink-0">
                    <div class="flex items-center gap-2 font-bold text-[#5c4b3f]">
                        <span id="indicador-color" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                        <span id="texto-resultados">Cargando base de datos...</span>
                    </div>
                    <div id="badge-estado" class="bg-white border border-[#e5d3c5] px-3 py-0.5 rounded-full font-bold text-[#7a6657] text-[10px] uppercase tracking-wider">
                        Conectando...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const PLANES_SIEMPRE_BLOQUEADOS = ['AD', 'COS', 'MM', 'MM/COM', 'MON/OP NO COS'];

        function normalizar(v){ return String(v ?? '').trim(); }
        function claveComparable(v){ return normalizar(v).replace(/\s+/g, ' ').toUpperCase(); }
        function quitarAcentos(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
        function normalizarCategoria(s){ return quitarAcentos(normalizar(s)).replace(/\s+/g, ' ').toUpperCase(); }

        let ORDEN_PLANES = [];
        const PRIORIDAD_ORDEN = ['IN 90', 'IN 90 (OSECAC)', 'IN 180', 'IN 360', 'AFILIADO SEC', 'ASISTENCIAL'];

        function ordenarPlanes(claves){
            return [...claves].sort((a, b) => {
                const ia = PRIORIDAD_ORDEN.indexOf(a);
                const ib = PRIORIDAD_ORDEN.indexOf(b);
                if (ia === -1 && ib === -1) return a.localeCompare(b);
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        let baseDeDatos = [];
        let filtroActivo = null;

        async function descargarExcel() {
            const variantes = ['precios(modificado).xlsx', 'precios.xlsx', 'PRECIOS.xlsx'];
            for (const url of variantes) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'array', data: await res.arrayBuffer() };
                } catch (e) {}
            }
            throw new Error('No se pudo encontrar el archivo excel');
        }

        // REGLAS DE NEGOCIO
        const PALABRAS_CLAVE_IN90_PERMITIDO = [
            'TURISMO', 'QUINCHO', 'SALON', 'PILETA', 'COLONIA', 'MUSICA', 'FUTBOL',
            'AUDITORIO', 'MASAJE', 'PODOLOG', 'COSMETO', 'PELUQUER', 'LAGUNA', 'ARROYO',
            'RESERVA', 'CUOTA', 'SEPELIO'
        ];
        function in90PermitidoEnCategoria(categoria){
            const cat = normalizarCategoria(categoria);
            return PALABRAS_CLAVE_IN90_PERMITIDO.some(kw => cat.includes(kw));
        }

        const PALABRAS_CLAVE_EXCLUIDAS_IN180 = ['COMED', 'FAMYL', 'PETRAGLIA', 'PSIQUIATRIA', 'CMD+'];
        function in180PermitidoEn(categoria, item){
            const cat = normalizarCategoria(categoria);
            const it = normalizarCategoria(item);
            if (PALABRAS_CLAVE_EXCLUIDAS_IN180.some(kw => cat.includes(kw))) return false;
            if (it.includes('COMED') || it.includes('FAMYL') || it.includes('PETRAGLIA') || it.includes('PSIQUIATRIA') || it.includes('CMD+')) return false;
            return true;
        }

        function planBloqueadoParaFila(plan, categoria, item){
            const p = claveComparable(plan);
            if (PLANES_SIEMPRE_BLOQUEADOS.includes(p)) return true;
            if (p === 'IN 90') {
                return !in90PermitidoEnCategoria(categoria);
            }
            if (p === 'IN 180') {
                return !in180PermitidoEn(categoria, item);
            }
            return false;
        }

        function procesarLibro(workbook) {
            const hoja = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '' });

            if (json.length < 2) return;

            const encabezados = json[0].map(c => normalizar(c));
            const colItemIndex = encabezados.findIndex(e => e.toUpperCase() === 'ITEM' || e.toUpperCase() === 'PRACTICA');
            const colCatIndex = encabezados.findIndex(e => e.toUpperCase() === 'CATEGORIA' || e.toUpperCase() === 'SERVICIO');

            const indexItem = colItemIndex !== -1 ? colItemIndex : 0;
            const indexCat = colCatIndex !== -1 ? colCatIndex : 1;

            const columnasPlanes = [];
            for (let i = 0; i < encabezados.length; i++) {
                if (i !== indexItem && i !== indexCat && encabezados[i]) {
                    columnasPlanes.push({ index: i, nombre: encabezados[i] });
                }
            }

            ORDEN_PLANES = ordenarPlanes(columnasPlanes.map(p => p.nombre));

            baseDeDatos = [];
            for (let r = 1; r < json.length; r++) {
                const fila = json[r];
                const itemNombre = normalizar(fila[indexItem]);
                const categoriaNombre = normalizar(fila[indexCat]);

                if (!itemNombre && !categoriaNombre) continue;

                const precios = {};
                columnasPlanes.forEach(p => {
                    let val = fila[p.index];
                    if (typeof val === 'number') {
                        val = '$ ' + val.toLocaleString('es-AR', { minimumFractionDigits: 0 });
                    } else {
                        val = normalizar(val);
                    }
                    precios[p.nombre] = val;
                });

                baseDeDatos.push({
                    item: itemNombre,
                    categoria: categoriaNombre,
                    precios: precios
                });
            }

            renderizarInterfaz();
        }

        // LISTA DE CONVENIOS PERMITIDOS PREDETERMINADOS
        const CONVENIOS_DEFINIDOS = ['CMD+', 'COMED', 'Dra. Capponi', 'Dr. Costanzi', 'Lab. Milani', 'Lab. Petraglia', 'FAMYL', 'PSIQUIATRIA'];

        function renderizarInterfaz() {
            document.getElementById('input-busqueda').disabled = false;
            document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
            document.getElementById('badge-estado').innerText = 'Base Lista';

            const filaFiltros = document.getElementById('fila-filtros');
            const filaCuotas = document.getElementById('fila-cuotas');
            const filaConvenios = document.getElementById('fila-convenios');
            const contenedorServicios = document.getElementById('contenedor-servicios');

            filaFiltros.innerHTML = '';
            filaCuotas.innerHTML = '';
            filaConvenios.innerHTML = '';
            contenedorServicios.innerHTML = '';

            // 1. Tipo de socio
            ORDEN_PLANES.forEach(plan => {
                const btn = document.createElement('button');
                btn.className = 'chip-filtro';
                btn.innerText = plan;
                btn.onclick = () => toggleFiltro('plan', plan, btn);
                filaFiltros.appendChild(btn);
            });

            const cuotasSet = new Set();
            const conveniosEncontrados = new Set();
            const mapaCategoriasServicio = {};

            baseDeDatos.forEach(d => {
                const cat = d.categoria;
                const item = d.item;

                const catNorm = normalizarCategoria(cat);
                const itemNorm = normalizarCategoria(item);

                // Cuotas
                if (catNorm.includes('CUOTA') || itemNorm.includes('CUOTA')) {
                    if (cat) cuotasSet.add(cat);
                    return;
                }

                // Detectar si pertenece a un Convenio
                let esConvenio = false;
                for (const conv of CONVENIOS_DEFINIDOS) {
                    const convNorm = normalizarCategoria(conv);
                    if (catNorm.includes(convNorm) || itemNorm.includes(convNorm)) {
                        conveniosEncontrados.add(conv);
                        esConvenio = true;
                        break;
                    }
                }

                if (!esConvenio && cat) {
                    if (!mapaCategoriasServicio[cat]) {
                        mapaCategoriasServicio[cat] = new Set();
                    }
                    if (item) mapaCategoriasServicio[cat].add(item);
                }
            });

            // Render Cuotas
            if (cuotasSet.size > 0) {
                document.getElementById('card-cuotas').style.display = 'block';
                cuotasSet.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'chip-filtro';
                    btn.innerText = cat;
                    btn.onclick = () => toggleFiltro('categoria', cat, btn);
                    filaCuotas.appendChild(btn);
                });
            } else {
                document.getElementById('card-cuotas').style.display = 'none';
            }

            // Render Convenios (Sólo los convenios explícitos)
            const listaConvenios = Array.from(conveniosEncontrados).length > 0 
                ? Array.from(conveniosEncontrados) 
                : CONVENIOS_DEFINIDOS;

            listaConvenios.forEach(conv => {
                const btn = document.createElement('button');
                btn.className = 'chip-filtro';
                btn.innerText = conv;
                btn.onclick = () => toggleFiltro('convenio', conv, btn);
                filaConvenios.appendChild(btn);
            });

            // Render Resto de Categorías
            Object.keys(mapaCategoriasServicio).forEach(catNombre => {
                const cardGroup = document.createElement('div');
                cardGroup.className = 'filtro-card';

                const title = document.createElement('div');
                title.className = 'filtro-titulo';
                title.innerHTML = `<span>📋</span> ${catNombre.toUpperCase()}`;
                cardGroup.appendChild(title);

                const wrap = document.createElement('div');
                wrap.className = 'flex flex-wrap gap-1.5';

                const btnCat = document.createElement('button');
                btnCat.className = 'chip-filtro';
                btnCat.innerText = 'VER TODO EN ' + catNombre;
                btnCat.onclick = () => toggleFiltro('categoria', catNombre, btnCat);
                wrap.appendChild(btnCat);

                cardGroup.appendChild(wrap);
                contenedorServicios.appendChild(cardGroup);
            });

            filtrarYMostrar();
        }

        function toggleFiltro(tipo, valor, elemento) {
            const yaActivo = elemento.classList.contains('activo');
            document.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));

            if (yaActivo) {
                filtroActivo = null;
            } else {
                elemento.classList.add('activo');
                filtroActivo = { tipo, valor };
            }

            filtrarYMostrar();
        }

        document.getElementById('input-busqueda').addEventListener('input', filtrarYMostrar);

        function filtrarYMostrar() {
            const busqueda = quitarAcentos(document.getElementById('input-busqueda').value.toLowerCase().trim());

            let datosFiltrados = baseDeDatos.filter(row => {
                const textoCompleto = quitarAcentos((row.item + ' ' + row.categoria).toLowerCase());
                const coincideBusqueda = !busqueda || textoCompleto.includes(busqueda);

                if (!coincideBusqueda) return false;

                if (filtroActivo) {
                    if (filtroActivo.tipo === 'categoria') {
                        return row.categoria === filtroActivo.valor;
                    }
                    if (filtroActivo.tipo === 'convenio') {
                        const valNorm = normalizarCategoria(filtroActivo.valor);
                        const catNorm = normalizarCategoria(row.categoria);
                        const itemNorm = normalizarCategoria(row.item);
                        return catNorm.includes(valNorm) || itemNorm.includes(valNorm);
                    }
                }
                return true;
            });

            renderTabla(datosFiltrados);
        }

        function renderTabla(datos) {
            const wrap = document.getElementById('tabla-wrap');
            const txtRes = document.getElementById('texto-resultados');

            if (datos.length === 0) {
                wrap.innerHTML = '<div class="p-8 text-center text-gray-500 font-bold text-sm">No se encontraron resultados para la búsqueda.</div>';
                txtRes.innerText = '0 registros encontrados';
                return;
            }

            txtRes.innerText = `${datos.length} registros encontrados`;

            let html = '<table><thead><tr><th>PRÁCTICA / ITEM</th>';

            ORDEN_PLANES.forEach(plan => {
                const esResaltada = filtroActivo && filtroActivo.tipo === 'plan' && filtroActivo.valor === plan;
                html += `<th class="${esResaltada ? 'resaltada' : ''}">${plan}</th>`;
            });

            html += '</tr></thead><tbody>';

            datos.forEach(row => {
                html += `<tr>`;
                html += `<td class="celda-item">
                    ${row.categoria ? `<span class="celda-categoria">${row.categoria}</span><br>` : ''}
                    ${row.item}
                </td>`;

                ORDEN_PLANES.forEach(plan => {
                    const esResaltada = filtroActivo && filtroActivo.tipo === 'plan' && filtroActivo.valor === plan;
                    const estaBloqueado = planBloqueadoParaFila(plan, row.categoria, row.item);
                    
                    let valor = row.precios[plan] || '-';

                    if (estaBloqueado) {
                        html += `<td class="celda-vacia ${esResaltada ? 'resaltada' : ''}">-</td>`;
                    } else {
                        html += `<td class="${esResaltada ? 'resaltada' : ''}">${valor}</td>`;
                    }
                });

                html += `</tr>`;
            });

            html += '</tbody></table>';
            wrap.innerHTML = html;
        }

        // Cargar al iniciar
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await descargarExcel();
                const workbook = XLSX.read(res.data, { type: 'array' });
                procesarLibro(workbook);
            } catch (err) {
                console.error(err);
                document.getElementById('texto-resultados').innerText = 'Error al cargar el archivo Excel.';
                document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                document.getElementById('badge-estado').innerText = 'Error';
            }
        });
    </script>
</body>
</html>
