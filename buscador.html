<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden bg-[#f4e7dc]">
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-0 overflow-hidden">
        <!-- BARRA LATERAL: FILTROS -->
        <aside class="lg:col-span-4 h-full overflow-y-auto pr-2 space-y-3">
            <h2 class="text-lg font-extrabold text-[#3b291a] sticky top-0 bg-[#f4e7dc] py-1 z-10">Filtros de Búsqueda</h2>
            
            <div class="bg-[#fbf5ef] border-[1.5px] border-[#e5d3c5] rounded-[14px] p-3">
                <div class="text-[11px] font-extrabold uppercase text-[#4a3525] mb-2"><span>👤</span> POR TIPO DE SOCIO</div>
                <div id="fila-filtros" class="flex flex-wrap gap-1.5"></div>
            </div>
            
            <!-- Aquí agregas el resto de filtros de tu buscador_2.html (Convenios, Servicios, etc) -->
        </aside>

        <!-- RESULTADOS -->
        <main class="lg:col-span-8 h-full overflow-y-auto flex flex-col gap-3">
            <div class="relative flex-shrink-0">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400">🔍</span>
                <input type="text" id="input-busqueda" placeholder="Buscar práctica o especialidad..." class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-[#e5d3c5] focus:ring-2 focus:ring-[#b85a3c] text-sm bg-white outline-none font-semibold text-gray-700 transition">
            </div>

            <div class="bg-white rounded-2xl border border-[#e5d3c5] overflow-hidden flex-1 flex flex-col min-h-0 mb-2">
                <div id="tabla-wrap" class="overflow-auto flex-1 p-1"></div>
            </div>
        </main>
    </div>
    <!-- Lógica JavaScript original de buscador_2.html (sin funciones de edición) -->

</html>
