<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>integra | Buscador de Precios y Servicios</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f7f5f0;
            font-family: 'Comfortaa', cursive;
        }
        h1, h2, h3, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        .bg-card { background-color: #ffffff; }
        .bg-inner-card { background-color: #fcfbfa; }
        .text-brand { color: #5c4b3f; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1cdb8; border-radius: 10px; }

        .chip-filtro {
            transition: all .15s ease;
        }
        .chip-filtro.activo {
            background-color: #5c4b3f !important;
            color: #fff !important;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">

        <!-- Encabezado -->
        <div class="bg-card rounded-[2rem] p-8 md:p-10 shadow-sm mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-5xl font-extrabold text-brand flex items-center gap-2">
                    integra <span class="text-4xl" style="color: #8c7a6b;">✳</span>
                </h1>
                <p class="text-gray-500 font-semibold mt-2 text-sm md:text-base">
                    Tres niveles de cobertura para acompañarte en cada etapa
                </p>
            </div>
        </div>

        <!-- Buscador -->
        <div class="relative mb-4">
            <span class="absolute left-6 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl">🔍</span>
            <input
                type="text"
                id="input-busqueda"
                placeholder="Buscar por práctica, código o especialidad..."
                class="w-full pl-14 pr-6 py-5 rounded-full border-none shadow-sm focus:ring-4 focus:ring-orange-100 text-lg bg-card outline-none font-outfit font-semibold text-gray-700 transition disabled:opacity-50"
                disabled
            >
        </div>

        <!-- Filtros por plan -->
        <div id="fila-filtros" class="flex flex-wrap gap-2 mb-6"></div>

        <!-- Estado -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-[#efeadd] px-6 py-3 rounded-full text-sm shadow-sm gap-3">
            <div class="flex items-center gap-3 font-bold text-gray-700">
                <span id="indicador-color" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                <span id="texto-resultados">Cargando base de datos...</span>
            </div>
            <div id="badge-estado" class="bg-white px-4 py-1.5 rounded-full font-bold text-gray-500 text-xs shadow-sm uppercase tracking-wider">
                Conectando...
            </div>
        </div>

        <!-- Resultados -->
        <div id="grilla-resultados" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

    </div>

    <script>
        // ------------------------------------------------------------------
        // CONFIGURACIÓN DE PLANES VISIBLES
        // El excel trae, para cada rubro, una fila de encabezado con los
        // nombres de los planes en distintas columnas. Ya NO usamos una
        // lista fija de nombres reconocidos: CUALQUIER columna que tenga
        // un título de texto en esa fila se toma como un plan válido y se
        // muestra. Las columnas sin título (vacías) en ese rubro se
        // ignoran, aunque tengan un valor cargado.
        // Esto hace que agregar o sacar un plan sea tan simple como
        // escribir o borrar su nombre en el encabezado del excel: no hace
        // falta tocar este archivo.
        // ------------------------------------------------------------------

        // Estas columnas nunca se muestran, aunque tengan título, por
        // pedido explícito (quedan bloqueadas incluso si reaparecen).
        const PLANES_SIEMPRE_BLOQUEADOS = ['AD', 'COS', 'MM', 'MM/COM', 'MON/OP NO COS'];

        // Las columnas K y L (índices 10 y 11, las 2 últimas del excel) se
        // usan internamente para cálculos de la planilla, no son un tipo de
        // socio real. Se ignoran siempre, sea cual sea el texto que tengan.
        const COLUMNAS_IGNORADAS = [10, 11];

        function normalizar(v){ return String(v ?? '').trim(); }
        function claveComparable(v){ return normalizar(v).replace(/\s+/g, ' ').toUpperCase(); }

        // Un título de plan es cualquier celda no vacía que tenga al menos
        // una letra (para no confundir con un precio como "35000" o "$0"),
        // salvo que esté en una columna ignorada.
        const TIENE_LETRAS = /[a-zA-ZÀ-ÿ]/;

        // Devuelve el texto EXACTO de la celda (tal cual está en el excel)
        // si parece un título de plan, o null si está vacía / es un número
        // / está en una columna ignorada.
        function detectarPlan(valorCelda, indiceColumna){
            if (COLUMNAS_IGNORADAS.includes(indiceColumna)) return null;
            const texto = normalizar(valorCelda);
            if (!texto) return null;
            return TIENE_LETRAS.test(texto) ? texto : null;
        }

        // Una fila es "de encabezado" si al menos 2 celdas (fuera de la col A)
        // tienen título de plan.
        function esFilaEncabezado(fila){
            let matches = 0;
            for (let c = 1; c < fila.length; c++) {
                if (detectarPlan(fila[c], c)) matches++;
            }
            return matches >= 2;
        }

        function filaVacia(fila){
            return !fila || fila.every(cell => normalizar(cell) === '');
        }

        // Orden en el que se muestran los planes dentro de cada tarjeta.
        // Se arma solo, en el orden en que las columnas aparecen en el excel.
        let ORDEN_PLANES = [];

        let baseDeDatos = [];
        let filtroActivo = null;

        async function descargarExcel() {
            const variantesXlsx = ['precios.xlsx', 'Precios.xlsx', 'PRECIOS.xlsx', './precios.xlsx'];
            for (const url of variantesXlsx) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'array', data: await res.arrayBuffer() };
                } catch (e) {}
            }
            // Si no hay .xlsx, probamos con un .csv exportado del mismo archivo.
            const variantesCsv = ['precios.csv', 'Precios.csv', 'PRECIOS.csv', './precios.csv'];
            for (const url of variantesCsv) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'string', data: await res.text() };
                } catch (e) {}
            }
            throw new Error('No se pudo encontrar precios.xlsx ni precios.csv');
        }

        // ------------------------------------------------------------------
        // RESTRICCIONES DE VISUALIZACIÓN
        // ------------------------------------------------------------------

        // Saca acentos para comparar sin importar tildes.
        function quitarAcentos(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
        function normalizarCategoria(s){ return quitarAcentos(normalizar(s)).replace(/\s+/g, ' ').toUpperCase(); }

        // "IN 90" (Int. 90) está bloqueado por defecto, salvo en los rubros
        // cuyo nombre contenga alguna de estas palabras clave (sin acentos,
        // sin importar mayúsculas). "IN 90 OSECAC" NO tiene esta restricción:
        // se muestra siempre que tenga valor, en cualquier rubro.
        const PALABRAS_CLAVE_IN90_PERMITIDO = [
            'TURISMO', 'QUINCHO', 'SALON CHICO', 'SALON GRANDE', 'SALON VIP',
            'PILETA', 'COLONIA', 'MUSICA', 'FUTBOL',
        ];

        function in90PermitidoEnCategoria(categoria){
            const cat = normalizarCategoria(categoria);
            return PALABRAS_CLAVE_IN90_PERMITIDO.some(kw => cat.includes(kw));
        }

        // "IN 180" se muestra en todos los rubros MENOS: convenios (COMED,
        // FAMYL, PETRAGLIA y cualquier ítem que diga "convenio"), consultas
        // médicas (Consulta Médica A/B/C) y psiquiatría.
        const PALABRAS_CLAVE_EXCLUIDAS_IN180 = ['COMED', 'FAMYL', 'PETRAGLIA', 'PSIQUIATRIA'];

        function in180PermitidoEn(categoria, item){
            const cat = normalizarCategoria(categoria);
            const it = normalizarCategoria(item);
            if (PALABRAS_CLAVE_EXCLUIDAS_IN180.some(kw => cat.includes(kw))) return false;
            if (it.includes('CONVENIO')) return false;
            if (it.startsWith('CONSULTA MEDICA')) return false;
            return true;
        }

        // Texto de exhibición para cada plan (primera vez que aparece en el
        // excel, tal cual está escrito), indexado por su clave canónica.
        let etiquetaPorClave = {};

        function parsearFilas(filas){
            const registros = [];
            let categoriaActual = '';
            let mapaColumnas = {}; // colIndex -> clave canónica de plan
            etiquetaPorClave = {};
            ORDEN_PLANES = [];

            for (let i = 0; i < filas.length; i++) {
                const fila = filas[i];
                if (filaVacia(fila)) continue;

                if (esFilaEncabezado(fila)) {
                    const nuevaCategoria = normalizar(fila[0]);
                    if (nuevaCategoria) categoriaActual = nuevaCategoria;

                    mapaColumnas = {};
                    for (let c = 1; c < fila.length; c++) {
                        const etiqueta = detectarPlan(fila[c], c);
                        if (!etiqueta) continue;
                        const clave = claveComparable(etiqueta);
                        mapaColumnas[c] = clave;
                        if (!(clave in etiquetaPorClave)) {
                            etiquetaPorClave[clave] = etiqueta;
                            ORDEN_PLANES.push(clave);
                        }
                    }
                    continue;
                }

                const nombreItem = normalizar(fila[0]);
                if (!nombreItem) continue;

                const precios = {};
                Object.entries(mapaColumnas).forEach(([colIndex, clave]) => {
                    const valor = fila[Number(colIndex)];
                    if (valor !== undefined && valor !== '') {
                        precios[clave] = valor;
                    }
                });

                if (Object.keys(precios).length === 0) continue; // sin valores útiles, se descarta

                const categoriaFinal = categoriaActual || 'GENERAL';

                // Ad, Cos y MM/MM-Com/Mon-Op no cos nunca se muestran.
                PLANES_SIEMPRE_BLOQUEADOS.forEach(clave => { delete precios[clave]; });

                // In 90 solo en los rubros permitidos (In 90 Osecac no tiene esta regla).
                if ('IN 90' in precios && !in90PermitidoEnCategoria(categoriaFinal)) {
                    delete precios['IN 90'];
                }

                // In 180: todo menos convenios / consultas médicas / psiquiatría.
                if ('IN 180' in precios && !in180PermitidoEn(categoriaFinal, nombreItem)) {
                    delete precios['IN 180'];
                }

                if (Object.keys(precios).length === 0) continue; // se quedó sin valores tras el bloqueo

                registros.push({ item: nombreItem, categoria: categoriaFinal, precios });
            }
            return registros;
        }

        document.addEventListener('DOMContentLoaded', () => {
            descargarExcel()
                .then(({ tipo, data }) => {
                    const workbook = tipo === 'array'
                        ? XLSX.read(data, { type: 'array' })
                        : XLSX.read(data, { type: 'string' });
                    const primeraHoja = workbook.Sheets[workbook.SheetNames[0]];
                    const filas = XLSX.utils.sheet_to_json(primeraHoja, { header: 1, defval: '' });

                    if (filas.length === 0) throw new Error('El Excel está vacío');

                    baseDeDatos = parsearFilas(filas);
                    if (baseDeDatos.length === 0) throw new Error('No se detectaron registros con precios');

                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    document.getElementById('texto-resultados').textContent = `Base lista (${baseDeDatos.length} registros cargados). Esperando búsqueda...`;
                    document.getElementById('badge-estado').textContent = 'Base Cargada';
                    document.getElementById('badge-estado').classList.add('text-emerald-600');

                    const input = document.getElementById('input-busqueda');
                    input.disabled = false;
                    input.focus();

                    renderizarFiltros();
                    renderizarTarjetas(baseDeDatos.slice(0, 10), filtroActivo);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                    document.getElementById('texto-resultados').textContent = 'Error al cargar el archivo de precios';
                    document.getElementById('badge-estado').textContent = 'Error Excel';
                    document.getElementById('badge-estado').classList.add('text-red-600');
                    document.getElementById('grilla-resultados').innerHTML = `
                        <div class="col-span-1 md:col-span-2 text-center py-10 bg-card rounded-[2rem] shadow-sm">
                            <p class="text-red-500 font-bold text-lg">No se pudo procesar el archivo de precios.</p>
                            <p class="text-gray-400 text-sm mt-2">Verifica que 'precios.xlsx' (o 'precios.csv') esté en el repositorio y tenga la estructura esperada.</p>
                        </div>`;
                });
        });

        function buscarEstricto(termino){
            const t = quitarAcentos(termino).toLowerCase().trim();
            if (!t) return [];
            return baseDeDatos.filter(r =>
                quitarAcentos(r.item).toLowerCase().includes(t) ||
                quitarAcentos(r.categoria).toLowerCase().includes(t)
            );
        }

        function aplicarBusquedaYFiltro(){
            const termino = document.getElementById('input-busqueda').value.trim();
            let resultados = termino
                ? buscarEstricto(termino)
                : baseDeDatos.slice(0, 10);

            if (filtroActivo) {
                resultados = resultados.filter(r => Object.prototype.hasOwnProperty.call(r.precios, filtroActivo));
            }

            renderizarTarjetas(resultados, filtroActivo);

            if (!termino) {
                document.getElementById('texto-resultados').textContent = filtroActivo
                    ? `Mostrando sugerencias de ${filtroActivo}...`
                    : 'Mostrando sugerencias...';
            } else {
                document.getElementById('texto-resultados').textContent = `Se encontraron ${resultados.length} práctica(s) / servicio(s)`;
            }
        }

        document.getElementById('input-busqueda').addEventListener('input', aplicarBusquedaYFiltro);

        function renderizarFiltros(){
            const planesPresentes = new Set();
            baseDeDatos.forEach(r => Object.keys(r.precios).forEach(p => planesPresentes.add(p)));

            const cont = document.getElementById('fila-filtros');
            const planesOrdenados = ORDEN_PLANES.filter(p => planesPresentes.has(p));

            cont.innerHTML = `
                <button class="chip-filtro activo px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white shadow-sm text-gray-500" data-plan="">
                    Todos los planes
                </button>` +
                planesOrdenados.map(clave => `
                    <button class="chip-filtro px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider bg-white shadow-sm text-gray-500" data-plan="${clave}">
                        ${etiquetaPorClave[clave] || clave}
                    </button>`).join('');

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroActivo = btn.dataset.plan || null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    aplicarBusquedaYFiltro();
                });
            });
        }

        function formatearValor(valor){
            if (typeof valor === 'number') {
                return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
            }
            const texto = normalizar(valor);
            // Algunos precios vienen guardados como texto numérico ("61950")
            // en vez de número; los formateamos igual como moneda.
            if (/^-?\d+([.,]\d+)?$/.test(texto)) {
                const numero = parseFloat(texto.replace(',', '.'));
                if (!isNaN(numero)) {
                    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(numero);
                }
            }
            return texto; // texto libre, ej. "$20 anual"
        }

        function renderizarTarjetas(datos, planFiltrado) {
            const contenedor = document.getElementById('grilla-resultados');

            if (datos.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-1 md:col-span-2 text-center py-10 bg-card rounded-[2rem] shadow-sm">
                        <p class="text-gray-400 font-bold text-lg">No se encontraron resultados.</p>
                    </div>`;
                return;
            }

            // Si hay un filtro de plan activo, la tarjeta solo debe mostrar
            // el precio de ESE plan, no los demás que tenga el ítem.
            const planesAMostrar = planFiltrado ? [planFiltrado] : ORDEN_PLANES;

            contenedor.innerHTML = datos.map(registro => {
                const clavesDelItem = planesAMostrar.filter(clave =>
                    Object.prototype.hasOwnProperty.call(registro.precios, clave)
                );

                const columnasHTML = clavesDelItem.map(clave => {
                    const valor = registro.precios[clave];
                    const etiqueta = etiquetaPorClave[clave] || clave;
                    return `
                        <div class="flex flex-col items-center text-center gap-1.5 px-2 py-3 border-r border-gray-100 last:border-r-0">
                            <span class="text-[10px] font-bold text-red-800 bg-red-50 px-2 py-1 rounded shadow-sm leading-tight">${etiqueta.toUpperCase()}</span>
                            <span class="font-outfit font-bold text-gray-800 text-base leading-tight">${formatearValor(valor)}</span>
                        </div>`;
                }).join('');

                return `
                    <div class="bg-card rounded-[2rem] p-6 md:p-8 shadow-sm border-2 border-transparent hover:border-[#efeadd] transition duration-300 flex flex-col h-full">
                        <div class="mb-4">
                            <span class="text-[10px] font-extrabold text-brand bg-[#efeadd] px-3 py-1.5 rounded-md tracking-widest uppercase shadow-sm">
                                ${registro.categoria}
                            </span>
                        </div>
                        <h3 class="font-outfit text-xl font-extrabold text-gray-800 mb-6 flex-grow leading-tight">
                            ${registro.item}
                        </h3>

                        <div class="bg-inner-card rounded-2xl p-3 border border-gray-100 shadow-inner mt-auto overflow-x-auto">
                            <p class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest px-2">Valores por tipo de plan / socio</p>
                            ${clavesDelItem.length > 0
                                ? `<div class="grid" style="grid-template-columns: repeat(${clavesDelItem.length}, minmax(72px, 1fr));">${columnasHTML}</div>`
                                : '<p class="text-sm text-gray-400 px-2 pb-2">Sin valores asignados</p>'}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
