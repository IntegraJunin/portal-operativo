<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Operativo INTEGRA - Buscador de Precios</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f4e7dc;
            --bg-card: #ffffff;
            --bg-box: #fbf5ef;
            --border-box: #e5d3c5;
            --text-brand: #4a3525;
            --chip-bg: #e8dad0;
            --chip-text: #4a3525;
            --chip-active-bg: #4a382a;
            --chip-active-text: #ffffff;
            --accent-orange: #b85a3c;
        }

        html, body {
            height: 100vh !important;
            max-height: 100vh !important;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background-color: var(--bg-main);
            font-family: 'Comfortaa', cursive;
            color: var(--text-brand);
        }

        h1, h2, h3, button, input, table, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0beb0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8a698; }

        .chip-filtro {
            background-color: var(--chip-bg);
            color: var(--chip-text);
            font-weight: 700;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 9999px;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            border: 1px solid transparent;
        }

        .chip-filtro:hover { background-color: #ded0c5; }
        .chip-filtro.activo {
            background-color: var(--chip-active-bg) !important;
            color: var(--chip-active-text) !important;
            border-color: var(--chip-active-bg);
        }

        .filtro-card {
            background-color: var(--bg-box);
            border: 1.5px solid var(--border-box);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .filtro-titulo {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-brand);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #tabla-wrap table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 550px;
        }

        #tabla-wrap th, #tabla-wrap td {
            padding: 10px 14px;
            text-align: left;
            white-space: nowrap;
        }

        #tabla-wrap thead th {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #7a6657;
            background: #faf6f0;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #ede3da;
            z-index: 10;
        }

        #tabla-wrap tbody td:first-child, #tabla-wrap thead th:first-child {
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 1;
            white-space: normal;
            min-width: 220px;
        }

        #tabla-wrap thead th:first-child { background: #faf6f0; z-index: 20; }
        #tabla-wrap tbody tr:nth-child(even) td { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:nth-child(even) td:first-child { background-color: #fdfaf7; }
        #tabla-wrap tbody tr:hover td { background-color: #f3e9e0; }

        #tabla-wrap tbody td {
            border-bottom: 1px solid #f2e9e1;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #3d2e24;
            cursor: pointer;
            font-size: 13px;
        }

        #tabla-wrap .celda-item { font-weight: 700; color: #3b291a; cursor: default; }
        #tabla-wrap .celda-categoria {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #ffffff;
            background: var(--accent-orange);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
        }

        #tabla-wrap .celda-vacia { color: #c0b2a6; font-weight: 600; cursor: default; }

        #tabla-wrap td.resaltada, #tabla-wrap th.resaltada {
            background-color: #fde047 !important;
            box-shadow: inset 0 0 0 2px #f59e0b;
            color: #3a332c !important;
        }
    </style>
</head>
<body class="p-3 md:p-4 flex flex-col h-screen overflow-hidden">

    <!-- CONTENIDO PRINCIPAL (SIN HEADER REPETIDO) -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-0 overflow-hidden">

        <!-- COLUMNA IZQUIERDA: FILTROS -->
        <aside class="lg:col-span-4 xl:col-span-4 h-full overflow-y-auto pr-2 space-y-3">
            <h2 class="text-lg font-extrabold text-[#3b291a] sticky top-0 bg-[#f4e7dc] py-1 z-10">Filtros</h2>

            <div class="filtro-card">
                <div class="filtro-titulo"><span>👤</span> FILTRO POR TIPO DE SOCIO</div>
                <div id="fila-filtros" class="flex flex-wrap gap-1.5"></div>
            </div>

            <div class="filtro-card">
                <div class="filtro-titulo"><span>🟠</span> FILTRO POR CONVENIO</div>
                <div id="fila-convenios" class="flex flex-wrap gap-1.5"></div>
            </div>

            <div id="contenedor-servicios" class="space-y-3"></div>
        </aside>

        <!-- COLUMNA DERECHA: RESULTADOS Y TABLA -->
        <main class="lg:col-span-8 xl:col-span-8 h-full overflow-y-auto pr-2 flex flex-col gap-3">
            <h2 class="text-lg font-extrabold text-[#3b291a] sticky top-0 bg-[#f4e7dc] py-1 z-10">Resultados</h2>

            <div class="relative flex-shrink-0">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-base">🔍</span>
                <input
                    type="text"
                    id="input-busqueda"
                    placeholder="Buscar por práctica, código o especialidad..."
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-[#e5d3c5] shadow-sm focus:ring-2 focus:ring-[#b85a3c] text-sm bg-white outline-none font-semibold text-gray-700 transition disabled:opacity-50"
                    disabled
                >
            </div>

            <div class="bg-white rounded-2xl border border-[#e5d3c5] shadow-sm overflow-hidden flex-1 flex flex-col min-h-0 mb-2">
                <div id="tabla-wrap" class="overflow-auto flex-1 p-1"></div>

                <div class="flex flex-col sm:flex-row justify-between items-center bg-[#faf6f0] px-4 py-2 border-t border-[#ede3da] text-xs gap-2 flex-shrink-0">
                    <div class="flex items-center gap-2 font-bold text-[#5c4b3f]">
                        <span id="indicador-color" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                        <span id="texto-resultados">Cargando base de datos...</span>
                    </div>
                    <div id="badge-estado" class="bg-white border border-[#e5d3c5] px-3 py-0.5 rounded-full font-bold text-[#7a6657] text-[10px] uppercase tracking-wider">
                        Conectando...
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script>
        const PLANES_SIEMPRE_BLOQUEADOS = ['AD', 'COS', 'MM', 'MM/COM', 'MON/OP NO COS'];
        const COLUMNAS_IGNORADAS = [10, 11];

        function normalizar(v){ return String(v ?? '').trim(); }
        function claveComparable(v){ return normalizar(v).replace(/\s+/g, ' ').toUpperCase(); }
        function quitarAcentos(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
        function normalizarCategoria(s){ return quitarAcentos(normalizar(s)).replace(/\s+/g, ' ').toUpperCase(); }

        const TIENE_LETRAS = /[a-zA-ZÀ-ÿ]/;

        function detectarPlan(valorCelda, indiceColumna){
            if (COLUMNAS_IGNORADAS.includes(indiceColumna)) return null;
            const texto = normalizar(valorCelda);
            if (!texto) return null;
            return TIENE_LETRAS.test(texto) ? texto : null;
        }

        function esFilaEncabezado(fila){
            let matches = 0;
            for (let c = 1; c < fila.length; c++) {
                if (detectarPlan(fila[c], c)) matches++;
            }
            return matches >= 2;
        }

        function filaVacia(fila){
            return !fila || fila.every(cell => normalizar(cell) === '');
        }

        let ORDEN_PLANES = [];
        const PRIORIDAD_ORDEN = ['IN 90', 'IN 90 (OSECAC)', 'IN 180', 'IN 360', 'AFILIADO SEC', 'ASISTENCIAL'];

        function ordenarPlanes(claves){
            return [...claves].sort((a, b) => {
                const ia = PRIORIDAD_ORDEN.indexOf(a);
                const ib = PRIORIDAD_ORDEN.indexOf(b);
                if (ia === -1 && ib === -1) return 0;
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        let baseDeDatos = [];
        let filtroActivo = null;

        async function descargarExcel() {
            const variantesCsv = ['precios.csv', 'Precios.csv', 'PRECIOS.csv', './precios.csv'];
            for (const url of variantesCsv) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'string', data: await res.text() };
                } catch (e) {}
            }
            const variantesXlsx = ['precios.xlsx', 'Precios.xlsx', 'PRECIOS.xlsx', './precios.xlsx'];
            for (const url of variantesXlsx) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return { tipo: 'array', data: await res.arrayBuffer() };
                } catch (e) {}
            }
            throw new Error('No se pudo encontrar precios.csv ni precios.xlsx');
        }

        const PALABRAS_CLAVE_IN90_PERMITIDO = [
            'TURISMO', 'QUINCHO', 'SALON CHICO', 'SALON GRANDE', 'SALON VIP',
            'PILETA', 'COLONIA', 'MUSICA', 'FUTBOL',
        ];

        function in90PermitidoEnCategoria(categoria){
            const cat = normalizarCategoria(categoria);
            return PALABRAS_CLAVE_IN90_PERMITIDO.some(kw => cat.includes(kw));
        }

        const PALABRAS_CLAVE_EXCLUIDAS_IN180 = ['COMED', 'FAMYL', 'PETRAGLIA', 'PSIQUIATRIA'];

        function in180PermitidoEn(categoria, item){
            const cat = normalizarCategoria(categoria);
            const it = normalizarCategoria(item);
            if (PALABRAS_CLAVE_EXCLUIDAS_IN180.some(kw => cat.includes(kw))) return false;
            if (it.includes('CONVENIO')) return false;
            if (it.startsWith('CONSULTA MEDICA')) return false;
            return true;
        }

        let etiquetaPorClave = {};

        function parsearFilas(filas){
            const registros = [];
            let categoriaActual = '';
            let mapaColumnas = {};
            etiquetaPorClave = {};
            ORDEN_PLANES = [];

            for (let i = 0; i < filas.length; i++) {
                const fila = filas[i];
                if (filaVacia(fila)) continue;

                if (esFilaEncabezado(fila)) {
                    const nuevaCategoria = normalizar(fila[0]);
                    if (nuevaCategoria) categoriaActual = nuevaCategoria;

                    mapaColumnas = {};
                    for (let c = 1; c < fila.length; c++) {
                        const etiqueta = detectarPlan(fila[c], c);
                        if (!etiqueta) continue;
                        const clave = claveComparable(etiqueta);
                        mapaColumnas[c] = clave;
                        if (!(clave in etiquetaPorClave)) {
                            etiquetaPorClave[clave] = etiqueta;
                            ORDEN_PLANES.push(clave);
                        }
                    }
                    continue;
                }

                const SUBENCABEZADOS_SIN_PLANES = ['CUOTAS SEPELIO', 'CUOTAS SOCIOS'];
                const esSubEncabezado = fila.slice(1).every(c => normalizar(c) === '')
                    && SUBENCABEZADOS_SIN_PLANES.includes(claveComparable(fila[0]));
                if (esSubEncabezado) {
                    categoriaActual = normalizar(fila[0]);
                    continue;
                }

                const nombreItem = normalizar(fila[0]);
                if (!nombreItem) continue;

                const precios = {};
                Object.entries(mapaColumnas).forEach(([colIndex, clave]) => {
                    const valor = fila[Number(colIndex)];
                    if (valor !== undefined && valor !== '') {
                        precios[clave] = valor;
                    }
                });

                if (Object.keys(precios).length === 0) continue;

                const categoriaFinal = categoriaActual || 'GENERAL';

                PLANES_SIEMPRE_BLOQUEADOS.forEach(clave => { delete precios[clave]; });

                if ('IN 90' in precios && !in90PermitidoEnCategoria(categoriaFinal)) {
                    delete precios['IN 90'];
                }

                if ('IN 180' in precios && !in180PermitidoEn(categoriaFinal, nombreItem)) {
                    delete precios['IN 180'];
                }

                if (Object.keys(precios).length === 0) continue;

                registros.push({ item: nombreItem, categoria: categoriaFinal, precios });
            }
            ORDEN_PLANES = ordenarPlanes(ORDEN_PLANES);
            return registros;
        }

        document.addEventListener('DOMContentLoaded', () => {
            descargarExcel()
                .then(({ tipo, data }) => {
                    const workbook = tipo === 'array'
                        ? XLSX.read(data, { type: 'array' })
                        : XLSX.read(data, { type: 'string' });
                    const primeraHoja = workbook.Sheets[workbook.SheetNames[0]];
                    const filas = XLSX.utils.sheet_to_json(primeraHoja, { header: 1, defval: '' });

                    if (filas.length === 0) throw new Error('El Excel está vacío');

                    baseDeDatos = parsearFilas(filas);
                    if (baseDeDatos.length === 0) throw new Error('No se detectaron registros con precios');

                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    document.getElementById('texto-resultados').textContent = `Base lista (${baseDeDatos.length} registros cargados).`;
                    document.getElementById('badge-estado').textContent = 'Base Cargada';
                    document.getElementById('badge-estado').classList.add('text-emerald-600');

                    const input = document.getElementById('input-busqueda');
                    input.disabled = false;

                    renderizarFiltros();
                    renderizarFiltroConvenios();
                    renderizarFiltroServicios();
                    aplicarBusquedaYFiltro();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('indicador-color').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                    document.getElementById('texto-resultados').textContent = 'Error al cargar el archivo de precios';
                    document.getElementById('badge-estado').textContent = 'Error Excel';
                    document.getElementById('badge-estado').classList.add('text-red-600');
                    document.getElementById('tabla-wrap').innerHTML = `
                        <div class="text-center py-8">
                            <p class="text-red-500 font-bold text-base">No se pudo procesar el archivo de precios.</p>
                            <p class="text-gray-400 text-xs mt-1">Verifica que 'precios.xlsx' (o 'precios.csv') esté disponible.</p>
                        </div>`;
                });
        });

        function buscarEstricto(termino){
            const t = quitarAcentos(termino).toLowerCase().trim();
            if (!t) return [];
            return baseDeDatos.filter(r =>
                quitarAcentos(r.item).toLowerCase().includes(t) ||
                quitarAcentos(r.categoria).toLowerCase().includes(t)
            );
        }

        function aplicarBusquedaYFiltro(){
            const termino = document.getElementById('input-busqueda').value.trim();

            let resultados;
            if (!termino && !filtroActivo && !convenioActivo && !servicioActivo) {
                resultados = baseDeDatos.slice(0, 15);
            } else {
                resultados = termino ? buscarEstricto(termino) : baseDeDatos.slice();
            }

            if (filtroActivo) {
                resultados = resultados.filter(r => Object.prototype.hasOwnProperty.call(r.precios, filtroActivo));
            }
            if (convenioActivo) {
                resultados = resultados.filter(r => convenioActivo.coincide(r.categoria));
            }
            if (servicioActivo) {
                resultados = resultados.filter(r => servicioActivo.coincide(r.item, r.categoria));
            }

            renderizarTabla(resultados, filtroActivo);

            if (!termino) {
                document.getElementById('texto-resultados').textContent = (filtroActivo || convenioActivo || servicioActivo)
                    ? `Mostrando ${resultados.length} registro(s)`
                    : `Mostrando primeras ${resultados.length} sugerencias...`;
            } else {
                document.getElementById('texto-resultados').textContent = `Se encontraron ${resultados.length} registro(s)`;
            }
        }

        const CONVENIOS_FIJOS = [
            { nombre: 'DRA. CAPPONI',   claves: ['CAPPONI'] },
            { nombre: 'COMED',          claves: ['COMED'] },
            { nombre: 'CMD (FAMY)',     claves: ['CMD', 'FAMYL'] },
            { nombre: 'DR. COSTANZI',   claves: ['COSTANZI'] },
            { nombre: 'NEXO TERAPIA',   claves: ['NEXO TERAPIA', 'NEXO'] },
        ].map(c => ({ ...c, coincide: (categoria) => {
            const cat = normalizarCategoria(categoria);
            return c.claves.some(k => cat.includes(k));
        }}));

        let convenioActivo = null;

        function renderizarFiltroConvenios(){
            const cont = document.getElementById('fila-convenios');
            cont.innerHTML =
                `<button class="chip-filtro activo" data-convenio="">TODOS</button>` +
                CONVENIOS_FIJOS.map((c, i) => `
                    <button class="chip-filtro" data-convenio="${i}">
                        ${c.nombre}
                    </button>`).join('');

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    convenioActivo = btn.dataset.convenio !== '' ? CONVENIOS_FIJOS[Number(btn.dataset.convenio)] : null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    aplicarBusquedaYFiltro();
                });
            });
        }

        function esConsultaDeLetra(item, categoria, letraExacta) {
            if (!item) return false;
            const txt = quitarAcentos(item).toUpperCase().replace(/["'«»]/g, ' ');
            const palabras = txt.split(/\s+/).filter(Boolean);

            if (!palabras.includes('CONSULTA')) return false;

            if (palabras.some(p => p.includes('ODONTO') || p.includes('KINESIO') || p.includes('NUTRI') || p.includes('ENFERM'))) {
                return false;
            }

            const tieneLetra = palabras.includes(letraExacta);
            const tieneOtrasLetras = ['A', 'B', 'C'].filter(l => l !== letraExacta).some(l => palabras.includes(l));

            return tieneLetra && !tieneOtrasLetras;
        }

        const SERVICIOS_GRUPOS = [
            {
                titulo: '🩺 CONSULTA MÉDICA',
                items: [
                    { id: 'cons_a', nombre: 'CONSULTA "A"', coincide: (it, cat) => esConsultaDeLetra(it, cat, 'A') },
                    { id: 'cons_b', nombre: 'CONSULTA "B"', coincide: (it, cat) => esConsultaDeLetra(it, cat, 'B') },
                    { id: 'cons_c', nombre: 'CONSULTA "C"', coincide: (it, cat) => esConsultaDeLetra(it, cat, 'C') },
                    { id: 'nutricion', nombre: 'NUTRICION', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('NUTRICI');
                    }}
                ]
            },
            {
                titulo: '🩺 OTRAS CONSULTAS',
                items: [
                    { id: 'cons_odonto', nombre: 'CONSULTA ODONTO', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('ODONTO');
                    }},
                    { id: 'kinesio', nombre: 'KINESIOLOGIA', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('KINESIO');
                    }},
                    { id: 'cuidado', nombre: 'CUIDADO PERSONAL', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('CUIDADO') || txt.includes('PERSONAL');
                    }},
                    { id: 'enfermeria', nombre: 'ENFERMERIA', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('ENFERMER');
                    }}
                ]
            },
            {
                titulo: '💳 CUOTAS',
                items: [
                    { id: 'cuota_socio', nombre: 'SOCIO', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('SOCIO') && !txt.includes('SEPELIO');
                    }},
                    { id: 'cuota_sepelio', nombre: 'SEPELIO', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('SEPELIO');
                    }}
                ]
            },
            {
                titulo: '🏛️ SALONES Y COMPLEX',
                items: [
                    { id: 'quincho', nombre: 'QUINCHOS', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('QUINCHO');
                    }},
                    { id: 'salon1', nombre: 'SALON 1', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('SALON 1') || txt.includes('SALON CHICO') || (txt.includes('SALON') && txt.includes('CHICO'));
                    }},
                    { id: 'salon2', nombre: 'SALON 2', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('SALON 2') || txt.includes('SALON GRANDE') || (txt.includes('SALON') && txt.includes('GRANDE'));
                    }},
                    { id: 'salon3', nombre: 'SALON 3', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('SALON 3') || txt.includes('SALON VIP') || (txt.includes('SALON') && txt.includes('VIP'));
                    }}
                ]
            },
            {
                titulo: '🏊 RECREACIÓN Y DEPORTES',
                items: [
                    { id: 'pileta', nombre: 'PILETA', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('PILETA');
                    }},
                    { id: 'colonia', nombre: 'COLONIA', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('COLONIA');
                    }},
                    { id: 'turismo', nombre: 'TURISMO', coincide: (it, cat) => {
                        const txt = quitarAcentos(it + ' ' + cat).toUpperCase();
                        return txt.includes('TURISMO');
                    }}
                ]
            }
        ];

        let servicioActivo = null;

        function renderizarFiltroServicios(){
            const cont = document.getElementById('contenedor-servicios');
            let html = '';

            SERVICIOS_GRUPOS.forEach((grupo, gIdx) => {
                html += `
                    <div class="filtro-card">
                        <div class="filtro-titulo">${grupo.titulo}</div>
                        <div class="flex flex-wrap gap-1.5">
                            <button class="chip-filtro activo" data-grupo="${gIdx}" data-servicio="">TODOS</button>
                `;

                grupo.items.forEach(item => {
                    html += `
                        <button class="chip-filtro" data-grupo="${gIdx}" data-servicio="${item.id}">
                            ${item.nombre}
                        </button>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            cont.innerHTML = html;

            const todosItems = SERVICIOS_GRUPOS.flatMap(g => g.items);

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.servicio;
                    servicioActivo = id ? todosItems.find(it => it.id === id) : null;

                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));

                    if (servicioActivo) {
                        btn.classList.add('activo');
                        const grupoSelIndex = btn.dataset.grupo;
                        SERVICIOS_GRUPOS.forEach((g, idx) => {
                            if (String(idx) !== String(grupoSelIndex)) {
                                const btnTodos = cont.querySelector(`.chip-filtro[data-grupo="${idx}"][data-servicio=""]`);
                                if (btnTodos) btnTodos.classList.add('activo');
                            }
                        });
                    } else {
                        SERVICIOS_GRUPOS.forEach((g, idx) => {
                            const btnTodos = cont.querySelector(`.chip-filtro[data-grupo="${idx}"][data-servicio=""]`);
                            if (btnTodos) btnTodos.classList.add('activo');
                        });
                    }

                    aplicarBusquedaYFiltro();
                });
            });
        }

        document.getElementById('input-busqueda').addEventListener('input', aplicarBusquedaYFiltro);

        function renderizarFiltros(){
            const planesPresentes = new Set();
            baseDeDatos.forEach(r => Object.keys(r.precios).forEach(p => planesPresentes.add(p)));

            const cont = document.getElementById('fila-filtros');
            const planesOrdenados = ORDEN_PLANES.filter(p => planesPresentes.has(p));

            cont.innerHTML = `
                <button class="chip-filtro activo" data-plan="">TODOS</button>` +
                planesOrdenados.map(clave => `
                    <button class="chip-filtro" data-plan="${clave}">
                        ${etiquetaPorClave[clave] || clave}
                    </button>`).join('');

            cont.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.addEventListener('click', () => {
                    filtroActivo = btn.dataset.plan || null;
                    cont.querySelectorAll('.chip-filtro').forEach(b => b.classList.remove('activo'));
                    btn.classList.add('activo');
                    aplicarBusquedaYFiltro();
                });
            });
        }

        function formatearValor(valor){
            if (typeof valor === 'number') {
                return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(valor);
            }
            const texto = normalizar(valor);
            if (/^-?\d+([.,]\d+)?$/.test(texto)) {
                const numero = parseFloat(texto.replace(',', '.'));
                if (!isNaN(numero)) {
                    return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(numero);
                }
            }
            return texto;
        }

        function renderizarTabla(datos, planFiltrado) {
            const contenedor = document.getElementById('tabla-wrap');

            if (datos.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-gray-400 font-bold text-base">No se encontraron resultados.</p>
                    </div>`;
                return;
            }

            const columnas = planFiltrado
                ? [planFiltrado]
                : ORDEN_PLANES.filter(clave => datos.some(r => Object.prototype.hasOwnProperty.call(r.precios, clave)));

            const theadHTML = `
                <tr>
                    <th>Práctica / Servicio</th>
                    ${columnas.map((clave, i) => `<th data-col="${i}">${(etiquetaPorClave[clave] || clave).toUpperCase()}</th>`).join('')}
                </tr>`;

            const tbodyHTML = datos.map((registro, fila) => {
                const celdas = columnas.map((clave, col) => {
                    const tieneValor = Object.prototype.hasOwnProperty.call(registro.precios, clave);
                    const contenido = tieneValor ? formatearValor(registro.precios[clave]) : '—';
                    const claseVacia = tieneValor ? '' : 'celda-vacia';
                    return `<td data-fila="${fila}" data-col="${col}" class="${claseVacia}">${contenido}</td>`;
                }).join('');

                return `
                    <tr>
                        <td data-fila="${fila}" class="celda-item">
                            <span class="celda-categoria">${registro.categoria}</span><br>
                            ${registro.item}
                        </td>
                        ${celdas}
                    </tr>`;
            }).join('');

            contenedor.innerHTML = `
                <table>
                    <thead>${theadHTML}</thead>
                    <tbody>${tbodyHTML}</tbody>
                </table>`;

            contenedor.querySelectorAll('td[data-col]').forEach(celda => {
                celda.addEventListener('click', () => {
                    const yaActiva = celda.classList.contains('resaltada');
                    contenedor.querySelectorAll('.resaltada').forEach(c => c.classList.remove('resaltada'));
                    if (yaActiva) return;

                    celda.classList.add('resaltada');

                    const encabezado = contenedor.querySelector(`thead th[data-col="${celda.dataset.col}"]`);
                    if (encabezado) encabezado.classList.add('resaltada');

                    const tituloFila = contenedor.querySelector(`tbody td.celda-item[data-fila="${celda.dataset.fila}"]`);
                    if (tituloFila) tituloFila.classList.add('resaltada');
                });
            });
        }
    </script>
</body>
</html>
